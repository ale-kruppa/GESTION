async function guardarCopiaAhora(){
  if(!soportaCarpeta()){descargarCopiaSeguridad();if(view==='copias')render();return}

    let h=carpetaCopias||await kvGet('carpeta').catch(()=>null);

}

function validarDatosImportados(d){if(!d||typeof d!=='object'||Array.isArray(d))return 'Formato no válido.';const arrs=['administradores','comunidades','clientes','materiales','proveedores','presupuestos','facturas','cobros','trabajos','gastos','compras','comprasMateriales','ivaPagos','irpfPagos','ssPagos','retiros','ajustesCaja','borrados','modificados'];const idOk=/^[A-Za-z0-9_.:-]{1,80}$/;for(const k of arrs){if(d[k]===undefined)continue;if(!Array.isArray(d[k]))return 'El campo '+k+' no es una lista.';for(const r of d[k]){if(!r||typeof r!=='object'||Array.isArray(r))return 'Hay un registro inválido en '+k+'.';if(r.id!==undefined&&!idOk.test(String(r.id)))return 'Hay un identificador no válido en '+k+'.'}}const imgOk=imagenValida;const e=d.empresa||{};if(typeof e!=='object'||!imgOk(e.logo)||!imgOk(e.fondoDocumentos))return 'Una imagen de la empresa no es válida.';for(const c of d.clientes||[])if(!imgOk(c.logo))return 'El logo de un cliente no es válido.';for(const t of d.trabajos||[])for(const f of (t.fotos||[]))if(!(typeof f==='string'&&(idOk.test(f)||(f.startsWith('data:image')&&imgOk(f)))))return 'Una foto de un trabajo no es válida.';return ''}

function numES(v){if(typeof v==='number')return isFinite(v)?v:NaN;let t=String(v==null?'':v).trim();if(!t)return NaN;t=t.replace(/[€\s ]/g,'').replace(/eur(os)?$/i,'');if(!/^-?[\d.,]+$/.test(t))return NaN;const c=t.lastIndexOf(','),p=t.lastIndexOf('.');
  if(c>=0&&p>=0){t=c>p?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'')}

  else if(p>=0){if(/^\d{1,3}(\.\d{3})+$/.test(t)&&!/^0\./.test(t))t=t.replace(/\./g,'')}

function parseCSV(text){text=String(text||'').replace(/^﻿/,'');const muestra=text.split(/\r?\n/).slice(0,8).join('\n');let delim=';',mx=-1;for(const d of [';',',','\t','|']){const n=muestra.split(d).length-1;if(n>mx){mx=n;delim=d}}
  const filas=[];let fila=[],cel='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cel+='"';i++}else q=false}else cel+=ch}else if(ch==='"'&&cel==='')q=true;else if(ch===delim){fila.push(cel);cel=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;fila.push(cel);cel='';if(fila.some(c=>String(c).trim()!==''))filas.push(fila);fila=[]}else cel+=ch}
  fila.push(cel);if(fila.some(c=>String(c).trim()!==''))filas.push(fila);return filas}

  return lineas.map(L=>{L.items.sort((a,b)=>a.x-b.x);const celdas=[];let fin=null;for(const it of L.items){if(celdas.length&&fin!==null&&it.x-fin<=5){celdas[celdas.length-1]+=(it.x-fin>0.8?' ':'')+it.s}else celdas.push(it.s);fin=it.x+(it.w||0)}return celdas.map(c=>celdaTxt(c)).filter(c=>c!=='')}).filter(r=>r.length)}

function adivinarMapeo(filas,tipo){const mp={codigo:0,descripcion:tipo==='pdf'?'resto':1,unidad:null,precio:'ultima',ivaIncl:false,ivaPct:21,filaInicio:1};
  const reC=/c[oó]d(igo|\.)?|referencia|\bref\b|sku/i,reD=/descrip|denominaci|nombre|concepto|producto|art[ií]culo/i,reP=/precio|pvp|tarifa|neto|importe|coste/i,reU=/^(unidad(es)?|ud\.?|u\.?m\.?|unid\.?)$/i;
  for(let r=0;r<Math.min(filas.length,20);r++){const row=(filas[r]||[]).map(celdaTxt);let c=null,d=null,p=null,u=null;row.forEach((t,j)=>{if(!t)return;if(c===null&&reC.test(t))c=j;else if(d===null&&reD.test(t))d=j;else if(p===null&&reP.test(t))p=j;else if(u===null&&reU.test(t))u=j});
    if([c,d,p].filter(x=>x!==null).length>=2){if(c!==null)mp.codigo=c;if(d!==null)mp.descripcion=d;else mp.descripcion='resto';if(p!==null)mp.precio=p;if(u!==null)mp.unidad=u;mp.filaInicio=r+2;if(p!==null&&/con\s*iva|iva\s*incl/i.test(row[p]))mp.ivaIncl=true;return mp}}
  return mp}
function filasAItems(filas,mp){const items=[],idx=new Map();let ignoradas=0,repetidos=0;for(let r=Math.max(0,(Number(mp.filaInicio)||1)-1);r<filas.length;r++){const row=filas[r];if(!row||!row.length||row.every(c=>celdaTxt(c)===''))continue;
    const cel=j=>(typeof j==='number'&&j>=0&&j<row.length)?row[j]:'';const cod=celdaTxt(mp.codigo==null?'':cel(mp.codigo));let pr=NaN,prIdx=null;
    if(mp.precio==='ultima'){for(let j=row.length-1;j>=0;j--){const v=numES(row[j]);if(!isNaN(v)&&v>0){pr=v;prIdx=j;break}}}else{pr=numES(cel(mp.precio));prIdx=mp.precio}
    if(!cod||isNaN(pr)||pr<=0){ignoradas++;continue}
    let desc;if(mp.descripcion==='resto'){const ex=new Set([mp.codigo,mp.unidad,prIdx].filter(x=>typeof x==='number'));desc=row.filter((c,j)=>!ex.has(j)).map(celdaTxt).filter(Boolean).join(' ')}else desc=celdaTxt(cel(mp.descripcion));
    const uni=mp.unidad==null?'':celdaTxt(cel(mp.unidad));if(mp.ivaIncl)pr=pr/(1+(Number(mp.ivaPct)||0)/100);pr=Math.round(pr*10000)/10000;
    const it={c:cod,d:desc,u:uni,p:pr},k=cod.toLowerCase();if(idx.has(k)){repetidos++;items[idx.get(k)]=it}else{idx.set(k,items.length);items.push(it)}}
  return {items,ignoradas,repetidos}}
function catDiff(viejos,nuevos){const m=new Map(viejos.map(x=>[x.c.toLowerCase(),x]));const res={nuevos:[],cambios:[],iguales:0,ausentes:0};const vistos=new Set();for(const n of nuevos){const k=n.c.toLowerCase();vistos.add(k);const o=m.get(k);if(!o)res.nuevos.push(n);else if(Math.abs(o.p-n.p)>0.00005)res.cambios.push({c:n.c,d:n.d||o.d,antes:o.p,despues:n.p,pct:o.p>0?Math.round((n.p-o.p)/o.p*1000)/10:0});else res.iguales++}res.ausentes=viejos.filter(x=>!vistos.has(x.c.toLowerCase())).length;return res}
function catFusionar(viejos,nuevos,fecha){const m=new Map(viejos.map(x=>[x.c.toLowerCase(),{...x}]));for(const n of nuevos){const k=n.c.toLowerCase();const o=m.get(k);if(!o)m.set(k,{...n});else{if(Math.abs(o.p-n.p)>0.00005){o.pa=o.p;o.fc=fecha;o.p=n.p}if(n.d)o.d=n.d;if(n.u)o.u=n.u}}return [...m.values()]}
function precioTxt(p){p=Number(p)||0;const r=Math.round(p*100)/100;if(Math.abs(r-p)<0.00005)return money(r);return p.toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:4})+' €'}
function sinAcentos(t){return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}

function catResumenHtml(id){const i=catInfo(id);return i.n?esc(i.n.toLocaleString('es-ES'))+' artículos<br><span class="smallnote">'+esc(date(i.fecha))+'</span>':'<span class="smallnote">Sin catálogo</span>'}

function catFilas(id,q){const c=catCache[id];if(!c)return [];const t=sinAcentos(q).trim();if(!t)return c.items;const ps=t.split(/\s+/);return c.items.filter(x=>{const h=sinAcentos(x.c+' '+x.d);return ps.every(p=>h.includes(p))})}
function catTablaHtml(){const id=window._catProv,q=window._catQ||'';const f=catFilas(id,q),mostrar=f.slice(0,100);
  const mats=new Set();db.materiales.forEach(m=>{(m.proveedores||[]).forEach(p=>{if(p.proveedorId===id)mats.add(String(p.codigo||'').toLowerCase())});if(m.proveedorId===id&&!(m.proveedores||[]).length)mats.add(String(m.codigo||'').toLowerCase())});
  const filas=mostrar.map(x=>{let cambio='';if(x.pa!=null){const pc=x.pa>0?Math.round((x.p-x.pa)/x.pa*1000)/10:0;cambio='<span class="'+(x.p>x.pa?'negative':'positive')+'" title="Antes '+esc(precioTxt(x.pa))+(x.fc?' · '+esc(date(x.fc)):'')+'">'+(x.p>x.pa?'▲ +':'▼ ')+String(pc).replace('.',',')+' %</span>'}
    const cod=encodeURIComponent(x.c).replace(/'/g,'%27');const accion=mats.has(x.c.toLowerCase())?'<span class="smallnote">Ya en Materiales</span>':'<button class="btn small" onclick="catPasar(decodeURIComponent(\''+cod+'\'))">Pasar a Materiales</button> <button class="btn small" onclick="catAnadirA(decodeURIComponent(\''+cod+'\'))">Añadir a un material</button>';
    return '<tr><td>'+esc(x.c)+'</td><td>'+esc(x.d)+'</td><td>'+esc(x.u)+'</td><td>'+esc(precioTxt(x.p))+'</td><td>'+cambio+'</td><td>'+accion+'</td></tr>'}).join('');
  return (f.length>100?'<div class="smallnote" style="margin-bottom:8px">Mostrando 100 de '+f.length.toLocaleString('es-ES')+' coincidencias. Escribe más para afinar.</div>':(q?'<div class="smallnote" style="margin-bottom:8px">'+f.length.toLocaleString('es-ES')+' coincidencias</div>':''))+(mostrar.length?'<div class="tablewrap"><table class="table"><tr><th>Código</th><th>Descripción</th><th>Unidad</th><th>Precio sin IVA</th><th>Último cambio</th><th>Acción</th></tr>'+filas+'</table></div>':'<div class="empty">No hay artículos que coincidan.</div>')}
function catBuscar(q){window._catQ=q;const el=document.getElementById('cat_tabla');if(el)el.innerHTML=catTablaHtml()}
function catPasar(codigo){const id=window._catProv,c=catCache[id];const x=c&&c.items.find(z=>z.c===codigo);if(!x)return;modalMaterial({id:null,codigo:x.c,nombre:x.d,unidad:x.u||'ud',proveedorId:id,precioCompra:x.p,ivaCompraPct:21,precio:0,stock:0,minStock:0})}
function catAnadirA(codigo){const id=window._catProv,c=catCache[id];const x=c&&c.items.find(z=>z.c===codigo);if(!x)return;if(!db.materiales.length){alert('Todavía no tienes materiales. Usa «Pasar a Materiales».');return}window._catAnadir={provId:id,item:x};modal('Añadir a un material que ya tienes','<p>Artículo del catálogo: <b>'+esc(x.c)+'</b> — '+esc(x.d)+' ('+esc(precioTxt(x.p))+' sin IVA)</p><div class="field"><label>¿A qué material lo añado?</label><select id="catMatSel"><option value="">— Elegir material —</option>'+db.materiales.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.codigo)+' — '+esc(m.nombre)+'</option>').join('')+'</select></div><div class="smallnote" style="margin-top:8px">Se abrirá la ficha del material con este distribuidor añadido para que lo revises y lo guardes.</div>','catAnadirSeguir()')}
function catAnadirSeguir(){const mid=val('catMatSel'),s=window._catAnadir;if(!mid){alert('Elige un material.');return}const m=db.materiales.find(x=>x.id===mid);if(!m||!s)return;closeModal();modalMaterial(m);const L=window._matProv;const i=L.findIndex(p=>p.proveedorId===s.provId);const fila={proveedorId:s.provId,codigo:s.item.c,precioCompra:s.item.p,url:i>=0?(L[i].url||''):''};if(i>=0)L[i]=fila;else L.push(fila);window._catAnadir=null;matProvPintar()}

async function impLeer(input){const f=input&&input.files&&input.files[0];if(!f)return;const im=window._imp;im.archivo=f.name;im.leyendo=true;im.error='';render();try{const r=await leerArchivoFilas(f);im.tipo=r.tipo;im.wb=r.wb||null;im.hojas=r.hojas;im.hoja=r.hoja;im.filas=r.filas;const v=db.proveedores.find(x=>x.id===im.provId);im.mapeo=(v&&v.mapeo&&v.mapeo.tipo===r.tipo)?{...v.mapeo}:adivinarMapeo(r.filas,r.tipo);delete im.mapeo.tipo;if(!r.filas.length)throw new Error('El archivo no tiene filas legibles.'+(r.tipo==='pdf'?' Si es un PDF escaneado (una foto), no se puede leer: pide el Excel o un PDF con texto.':''));im.paso=2}catch(e){im.error=e?.message||String(e);im.filas=null;im.paso=1}im.leyendo=false;render()}
function impCambioHoja(h){const im=window._imp;if(!im.wb)return;im.hoja=h;im.filas=hojaAFilas(libXlsx(),im.wb,h);im.mapeo=adivinarMapeo(im.filas,'excel');render()}
function impCampo(campo,valor){const m=window._imp.mapeo;if(campo==='codigo'||campo==='unidad'||campo==='descripcion'||campo==='precio'){if(valor===''||valor==null)m[campo]=null;else if(valor==='resto'||valor==='ultima')m[campo]=valor;else m[campo]=Number(valor)}else if(campo==='filaInicio')m.filaInicio=Math.max(1,Math.floor(Number(valor)||1));else if(campo==='ivaIncl')m.ivaIncl=valor==='si';else if(campo==='ivaPct')m.ivaPct=Math.max(0,Number(valor)||0);render()}
function impContinuar(){const im=window._imp;const m=im.mapeo;if(m.codigo==null||m.precio==null){alert('Indica al menos la columna del código y la del precio.');return}const r=filasAItems(im.filas,m);if(!r.items.length){alert('Con estas columnas no se ha leído ningún artículo. Revisa la columna del código, la del precio y la primera fila de datos.');return}im.res=r;const viejos=(catCache[im.provId]&&catCache[im.provId].items)||[];im.diff=catDiff(viejos,r.items);im.primera=!viejos.length;im.paso=3;render()}
async function impAplicar(){const im=window._imp;if(!im||!im.res)return;const id=im.provId,fecha=hoyLocal();const viejos=(catCache[id]&&catCache[id].items)||[];try{const items=catFusionar(viejos,im.res.items,fecha);await catGuardar(id,{items,fecha,archivo:im.archivo||''});const v=db.proveedores.find(x=>x.id===id);if(v)v.mapeo={...im.mapeo,tipo:im.tipo};const d=im.diff,prim=im.primera;window._imp=null;window._catProv=id;window._catQ='';view='catalogo';save();alert(prim?'Catálogo importado: '+items.length.toLocaleString('es-ES')+' artículos.':'Lista actualizada: '+d.nuevos.length+' nuevos, '+d.cambios.length+' con precio cambiado.');const cands=candidatosLista(id,items);if(cands.length)proponerPrecios(cands,'lista')}catch(e){alert('No se pudo guardar el catálogo.\n\n'+(e?.message||e))}}

function importarView(){const im=window._imp;const v=im&&db.proveedores.find(x=>x.id===im.provId);if(!v)return shell('<div class="section"><div class="empty">No hay ninguna importación en curso.</div><div class="actions"><button class="btn" onclick="go(\'proveedores\')">Volver a Distribuidores</button></div></div>','Importar lista de precios');

  if(im.paso===1||!im.filas){return shell('<div class="section"><h3>Paso 1: elige el archivo</h3><div class="smallnote" style="margin:6px 0 12px">Excel (.xlsx, .xls), CSV o PDF con texto, tal como te lo manda el distribuidor. Nada se guarda hasta el final y tú das el OK.</div>'+(im.error?'<div class="notice" style="border-left:4px solid #dc2626">'+esc(im.error)+'</div>':'')+(im.leyendo?'<div class="notice">Leyendo '+esc(im.archivo||'')+'… los PDF grandes pueden tardar un poco.</div>':'<input type="file" id="imp_file" accept=".xlsx,.xls,.xlsm,.ods,.csv,.tsv,.txt,.pdf" onchange="impLeer(this)">')+'<div class="actions" style="margin-top:12px">'+volver+'</div></div>',tit)}
  if(im.paso===2){const m=im.mapeo,f=im.filas;let nc=0;f.slice(0,40).forEach(r=>{if(r.length>nc)nc=r.length});nc=Math.min(Math.max(nc,1),30);const inicio=Math.max(0,(m.filaInicio||1)-1);const ej=j=>{const r=f.slice(inicio,inicio+3).map(x=>celdaTxt(x[j])).filter(Boolean)[0]||'';return ej2(r)};const ej2=t=>t.length>22?t.slice(0,22)+'…':t;

    const r=filasAItems(f,m);const ejs=r.items.slice(0,6).map(x=>'<tr><td>'+esc(x.c)+'</td><td>'+esc(x.d)+'</td><td>'+esc(x.u)+'</td><td>'+esc(precioTxt(x.p))+'</td></tr>').join('');
    return shell('<div class="section"><h3>Paso 2: indica qué es cada columna</h3><div class="smallnote" style="margin:6px 0 12px">Archivo: '+esc(im.archivo||'')+' · '+f.length.toLocaleString('es-ES')+' filas. Si el distribuidor usa siempre el mismo formato, esto se recuerda para la próxima vez.</div>'+

     '<div class="section"><h3>Así se ve el archivo</h3><div class="tablewrap"><table class="table"><tr>'+Array.from({length:nc},(_,j)=>'<th>Columna '+(j+1)+'</th>').join('')+'</tr>'+prev+'</table></div></div>'+
     '<div class="section"><h3>Así se leerá</h3>'+(r.items.length?'<div class="smallnote" style="margin-bottom:8px">'+r.items.length.toLocaleString('es-ES')+' artículos'+(r.ignoradas?' · '+r.ignoradas+' filas ignoradas (sin código o sin precio)':'')+(r.repetidos?' · '+r.repetidos+' códigos repetidos (vale el último)':'')+'</div><div class="tablewrap"><table class="table"><tr><th>Código</th><th>Descripción</th><th>Unidad</th><th>Precio sin IVA</th></tr>'+ejs+'</table></div>':'<div class="notice" style="border-left:4px solid #ea580c">Con esta elección no se lee ningún artículo. Cambia las columnas o la fila de inicio.</div>')+'<div class="actions" style="margin-top:12px">'+volver+'<button class="btn primary" onclick="impContinuar()">Continuar</button></div></div>',tit)}
  const d=im.diff,r=im.res;const card=(l,v,c,n)=>'<div class="card"><div class="label">'+l+'</div><div class="big '+(c||'')+'">'+v+'</div>'+(n?'<div class="smallnote">'+n+'</div>':'')+'</div>';

  return shell('<div class="section"><h3>Paso 3: revisa y confirma</h3><div class="cards">'+card('Artículos en el archivo',r.items.length.toLocaleString('es-ES'),'',(r.ignoradas?r.ignoradas+' filas ignoradas':''))+(im.primera?card('Primera importación','Todos nuevos','','Se creará el catálogo completo'):card('Nuevos',d.nuevos.length.toLocaleString('es-ES'))+card('Precio cambiado',d.cambios.length.toLocaleString('es-ES'),d.cambios.length?'negative':'',subidas+' suben · '+bajadas+' bajan')+card('Sin cambios',d.iguales.toLocaleString('es-ES'))+card('No aparecen en el archivo',d.ausentes.toLocaleString('es-ES'),'','Se mantienen como estaban'))+'</div>'+
   (d.cambios.length?'<h3 style="margin-top:14px">Cambios de precio'+(d.cambios.length>100?' (los 100 mayores)':'')+'</h3><div class="tablewrap"><table class="table"><tr><th>Código</th><th>Descripción</th><th>Antes</th><th>Ahora</th><th>Variación</th></tr>'+tabla+'</table></div>':'')+

function campoG(id){return (Array.isArray(db.campoGestion)?db.campoGestion:[]).find(x=>x.id===id)||null}
function campoGset(id,cambios){if(!Array.isArray(db.campoGestion))db.campoGestion=[];let g=db.campoGestion.find(x=>x.id===id);if(!g){g={id};db.campoGestion.push(g)}Object.assign(g,cambios,{modificado:new Date().toISOString()});return g}
function campoPlazos(){const e=db.empresa||{};return {aviso:Math.max(1,Number(e.campoAvisoDias)||15),descarte:Math.max(1,Number(e.campoDescarteDias)||30)}}
function campoDias(iso){if(!iso)return 0;const t=new Date(iso).getTime();return isNaN(t)?0:Math.max(0,Math.floor((Date.now()-t)/86400000))}
function campoPres(c){const g=campoG(c.id);return g&&g.presupuestoId?db.presupuestos.find(x=>x.id===g.presupuestoId)||null:null}
function campoEstado(c){const g=campoG(c.id)||{},p=campoPres(c),P=campoPlazos();
  if(p&&presupuestoYaFacturado(p.id))return {k:'realizado',t:'Realizado',cls:'ok'};
  if(g.ejecucion||(p&&p.estado==='Aceptado'))return {k:'ejecucion',t:'En ejecución',cls:'ok'};
  if(g.descartado||(p&&p.estado==='Rechazado'))return {k:'descartado',t:'Descartado',cls:''};
  if(g.enviadoEn){const desde=g.reactivadoEn&&g.reactivadoEn>g.enviadoEn?g.reactivadoEn:g.enviadoEn,d=campoDias(desde);if(d>=P.descarte)return {k:'descartado',t:'Descartado (más de '+P.descarte+' días sin novedades)',cls:'',auto:true};return {k:'enviado',t:'Enviado'+(p?' '+p.numero:'')+' · hace '+d+' día'+(d===1?'':'s'),cls:d>=P.aviso?'warn':'',avisar:d>=P.aviso}}
  return {k:'revisar',t:p?'Pasado a '+p.numero+': falta enviarlo':'Por revisar y enviar',cls:'warn'}}
function campoCliente(c){const r=c.cliente.id?buscarCliente(c.cliente.id):null;return r?{nombre:r.nombre,nuevo:false}:{nombre:c.cliente.nombre||'Sin nombre',nuevo:true}}
function campoTrabajos(c){if(Array.isArray(c.detalle))return c.detalle.map(t=>t.titulo).join(' + ');const tr=c.trabajos||{};return Object.keys(tr).filter(k=>tr[k]&&tr[k].on).map(k=>({solar:'Solar',cargador:'Cargador',cuadro:'Cuadro',contadores:'Contadores',libre:'Libre'}[k]||k)).join(' + ')}
function campoAlertas(){let rev=0,llamar=0;campoLista().forEach(c=>{const e=campoEstado(c);if(e.k==='revisar')rev++;if(e.k==='enviado'&&e.avisar)llamar++});return {rev,llamar}}
const CAMPO_FILTROS=[['todos','Todos'],['revisar','Por revisar y enviar'],['enviado','Enviados'],['ejecucion','En ejecución'],['realizado','Realizados'],['descartado','Descartados']];
function campoView(){const f=window._campoFiltro||'todos',L=campoLista().slice().sort((a,b)=>String(b.fecha||b.creado||'').localeCompare(String(a.fecha||a.creado||'')));const cnt={};L.forEach(c=>{const k=campoEstado(c).k;cnt[k]=(cnt[k]||0)+1});const P=campoPlazos();

    if(e.k==='revisar')acc+=p?'<button class="btn small" onclick="editPresupuesto(\''+esc(p.id)+'\')">Abrir '+esc(p.numero)+'</button><button class="btn small primary" onclick="campoAccion(\''+id+'\',\'enviado\')">Marcar enviado al cliente</button>':'<button class="btn small primary" onclick="campoPasar(\''+id+'\')">Revisar y pasar a presupuesto</button>';

    if(e.k==='descartado')acc+='<button class="btn small primary" onclick="campoAccion(\''+id+'\',\'reactivar\')">Reactivar</button>';

    return '<tr><td>'+date(c.fecha)+'</td><td>'+esc(cl.nombre)+(cl.nuevo?' <span class="badge warn">nuevo</span>':'')+'</td><td>'+esc(campoTrabajos(c))+'</td><td>'+esc(c.hechoPor||'—')+'</td><td>'+money(c.totales&&c.totales.total)+(c.estado==='enviado'?'<br><span class="smallnote">estimado enviado al cliente</span>':'')+'</td><td><span class="badge '+e.cls+'">'+esc(e.t)+'</span></td><td><div class="actions" style="justify-content:flex-start;flex-wrap:wrap;gap:6px;margin:0">'+acc+'</div></td></tr>'}).join('');
  return shell('<div class="section"><div class="smallnote" style="margin-bottom:10px">Los presupuestos estimados que se hacen con la app de presupuestos (en la obra o en la oficina) llegan aquí solos al sincronizar. Se revisan, se pasan a presupuesto normal (con número) y se sigue su estado. El de campo no se borra: queda para comparar.</div>'+filtros+
    (filas?'<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Cliente</th><th>Trabajos</th><th>Hecho por</th><th>Total estimado</th><th>Estado</th><th>Acciones</th></tr>'+filas+'</table></div>':'<div class="empty">'+(L.length?'No hay presupuestos en este estado.':'Todavía no ha llegado ningún presupuesto de la app de presupuestos.')+'</div>')+'</div>'+
    '<div class="section"><h3>Plazos de los avisos</h3><div class="formgrid"><div class="field"><label>Avisar «llamar al cliente» a los (días desde el envío)</label><input type="number" min="1" step="1" value="'+P.aviso+'" onchange="campoPlazoSet(\'campoAvisoDias\',this.value)"></div><div class="field"><label>Pasar a «Descartado» a los (días desde el envío)</label><input type="number" min="1" step="1" value="'+P.descarte+'" onchange="campoPlazoSet(\'campoDescarteDias\',this.value)"></div></div><div class="smallnote">Lo descartado no se borra: con «Reactivar» vuelve a contar desde hoy.</div></div>','Presupuestos en campo')}
function campoPlazoSet(k,v){const n=Math.max(1,Math.round(Number(v)||0));db.empresa[k]=n;save()}
function campoAccion(id,acc){const ahora=new Date().toISOString();
  if(acc==='enviado')campoGset(id,{enviadoEn:ahora,descartado:false,ejecucion:false});
  if(acc==='ejecucion')campoGset(id,{ejecucion:true,descartado:false});
  if(acc==='descartar'){if(!confirm('¿Pasar este presupuesto a «Descartado»? No se borra: lo puedes reactivar cuando quieras.'))return;campoGset(id,{descartado:true,ejecucion:false})}
  if(acc==='reactivar')campoGset(id,{descartado:false,ejecucion:false,reactivadoEn:ahora});

function campoVer(id){const c=campoLista().find(x=>x.id===id);if(!c)return;const cl=campoCliente(c),r=c.cliente.id?buscarCliente(c.cliente.id):null,gps=c.cliente.gps;

  if(Array.isArray(c.detalle))c.detalle.forEach(t=>{h+='<h3 style="margin:14px 0 6px">'+esc(t.titulo)+'</h3>'+(t.resumen?'<div class="smallnote">'+esc(t.resumen)+'</div>':'')+'<div class="tablewrap"><table class="table"><tr><th>Material</th><th>Cantidad</th><th>Precio</th><th>Importe</th></tr>'+(t.items||[]).map(x=>'<tr><td>'+esc(x.nombre)+(x.revisar?'<br><span class="smallnote" style="color:#c2410c">✎ puesto a mano en la obra: revisar</span>':'')+'</td><td>'+esc(String(x.cantidad).replace('.',','))+' '+esc(x.unidad||'')+'</td><td>'+money(x.precio)+'</td><td>'+money(x.cantidad*x.precio)+'</td></tr>').join('')+(t.pendientes||[]).map(x=>'<tr><td><span class="badge warn">sin elegir</span> '+esc(x.nombre)+'</td><td>'+esc(String(x.cantidad).replace('.',','))+'</td><td>—</td><td>—</td></tr>').join('')+'<tr><td><b>Mano de obra</b>'+(t.moDesc?'<br><span class="smallnote">'+esc(t.moDesc)+'</span>':'')+'</td><td></td><td></td><td>'+money(t.mo)+'</td></tr><tr><td><b>Subtotal</b></td><td></td><td></td><td><b>'+money(t.sub)+'</b></td></tr></table></div>'+(t.nota?'<div class="smallnote">'+esc(t.nota)+'</div>':'')+(t.info?'<div class="smallnote">'+esc(t.info)+'</div>':'')+(t.obs?'<div class="notice" style="margin-top:6px"><b>Observaciones de la obra:</b> '+esc(t.obs)+'</div>':'')});
  else h+='<div class="notice">Este presupuesto se hizo con la primera versión de la app y no trae el detalle de materiales: solo el total.</div>';
  const T=c.totales||{};h+='<div class="cards" style="margin-top:12px"><div class="card"><div class="label">Base</div><div class="big">'+money(T.base)+'</div></div><div class="card"><div class="label">IVA ('+esc(T.iva)+' %)</div><div class="big">'+money(T.ivaImporte)+'</div></div><div class="card"><div class="label">Total estimado</div><div class="big">'+money(T.total)+'</div></div></div>';
  const fotos=(c.fotos||[]).map(fotoSrc).filter(Boolean);if(fotos.length)h+='<h3 style="margin:14px 0 6px">Fotos</h3><div style="display:flex;flex-wrap:wrap;gap:8px">'+fotos.map(u=>'<a href="'+esc(u)+'" target="_blank"><img src="'+esc(u)+'" style="width:110px;height:110px;object-fit:cover;border-radius:8px" alt="Foto"></a>').join('')+'</div>';else if((c.fotos||[]).length)h+='<div class="smallnote">Tiene '+c.fotos.length+' foto(s) que todavía no han bajado: sincroniza.</div>';
  modal('Presupuesto de campo',h,'closeModal()')}
function campoPasar(id){const c=campoLista().find(x=>x.id===id);if(!c)return;
  if(c.cliente.id&&buscarCliente(c.cliente.id)){campoAbrirPresupuesto(c,c.cliente.id);return}
  const tel=String(c.cliente.tel||'').replace(/\D/g,'').slice(-9),nom=sinAcentos(c.cliente.nombre||'').trim();
  const todos=[...db.clientes,...db.comunidades,...db.administradores];
  const par=todos.find(x=>(tel.length>=9&&String(x.tel||'').replace(/\D/g,'').slice(-9)===tel))||(nom?todos.find(x=>{const n=sinAcentos(x.nombre||'').trim();return n&&(n===nom||(nom.length>=5&&(n.includes(nom)||nom.includes(n))))}):null);
  if(par&&confirm('Este cliente no está en tu lista, pero hay uno parecido: «'+par.nombre+'»'+(par.tel?' ('+par.tel+')':'')+'.\n\n¿Es el mismo?\nAceptar = usar ese\nCancelar = cargarlo como cliente nuevo')){campoAbrirPresupuesto(c,par.id);return}
  if(!confirm('«'+(c.cliente.nombre||'Este cliente')+'» no está en tu lista. ¿Quieres cargarlo como cliente nuevo?\n\nSe abre su ficha con lo que se cargó en la obra: completa lo que falta.'))return;
  modalCliente({_campo:true,nombre:c.cliente.nombre||'',tel:c.cliente.tel||'',dir:c.cliente.dir||'',obs:'Cargado desde un presupuesto de campo'+(c.hechoPor?' (hecho por '+c.hechoPor+')':'')+'.'});window._campoPend=id;
  const t=document.getElementById('appModalTitulo');if(t)t.textContent='Nuevo cliente (desde un presupuesto de campo)';
  const falta=[['NIF/CIF','nif'],['Localidad','localidad'],['Código postal','cp'],['Email','email']].filter(([,k])=>!String(val(k)||'').trim()).map(([n])=>n);
  const fg=document.querySelector('#appModal .formgrid');if(fg)fg.insertAdjacentHTML('beforebegin','<div class="notice" style="border-left:4px solid #ea580c;margin-bottom:10px">Viene de la obra con nombre, teléfono y dirección.'+(falta.length?' Completa lo que falta: <b>'+falta.join(', ')+'</b>.':'')+' Al guardar se abre el presupuesto ya relleno.</div>')}
function campoItems(c){const items=[];let mo=0;
  if(Array.isArray(c.detalle)){c.detalle.forEach(t=>{(t.items||[]).forEach(x=>{const m=x.materialId?db.materiales.find(z=>z.id===x.materialId):null;items.push({materialId:m?m.id:'',codigo:m?(m.codigo||''):(x.codigo||''),nombre:m?m.nombre:x.nombre,cantidad:Number(x.cantidad)||0,precio:Number(x.precio)||0,costeCompra:m?(Number(m.precioCompra)||0):0,unidad:x.unidad||(m&&m.unidad)||'ud',...(x.revisar||(x.materialId&&!m)?{revisar:true}:{})})});
    (t.pendientes||[]).forEach(x=>items.push({materialId:'',codigo:'',nombre:String(x.nombre||'').replace(/\s*\([^)]*\)/g,'').trim(),cantidad:Number(x.cantidad)||0,precio:0,costeCompra:0,unidad:'ud',revisar:true}));mo+=Number(t.mo)||0})}
  else{const T=c.totales||{};items.push({materialId:'',codigo:'',nombre:'Presupuesto estimado de campo ('+campoTrabajos(c)+')',cantidad:1,precio:Number(T.base)||0,costeCompra:0,unidad:'ud',revisar:true})}
  return {items,mo:round2(mo)}}
function campoAbrirPresupuesto(c,clienteId){const {items,mo}=campoItems(c);go('presupuestos');modalPresupuesto();window._campoConv=c.id;
  window._bp=bpCadena(clienteId);bpPintar();bpCambio(true);window.tempPresupuestoItems=items;
  const desc=(Array.isArray(c.detalle)?c.detalle.map(t=>String(t.moDesc||'').trim()).filter(Boolean).join('\n'):'')||String(c.desc||'').trim();
  const d=document.getElementById('desc');if(d)d.value=desc;const mm=document.getElementById('manoObra');if(mm)mm.value=mo;const iv=document.getElementById('iva');if(iv&&c.iva!=null)iv.value=String(Number(c.iva));
  renderPresupuestoItems();updatePresupuestoTotal();
  const t=document.getElementById('appModalTitulo');if(t)t.textContent='Nuevo presupuesto (desde campo)';
  const fg=document.querySelector('#appModal .formgrid');if(fg)fg.insertAdjacentHTML('beforebegin','<div class="notice" style="margin-bottom:10px">Relleno con el presupuesto de campo'+(c.hechoPor?' de '+esc(c.hechoPor):'')+' ('+money(c.totales&&c.totales.total)+' estimado). Revisa precios y los materiales marcados «revisar» y guárdalo. El de campo se queda guardado para comparar.</div>')}
/* ==== CACHÉ DE CÁLCULOS (se vacía en cada render y en cada guardado) ==== */
const _cache=new Map();
function invalidarCache(){_cache.clear()}
function memo(nombre,fn){return function(...a){const k=nombre+'|'+a.join('|');if(_cache.has(k))return _cache.get(k);const v=fn(...a);_cache.set(k,v);return v}}
function cobrosPorFactura(){let m=_cache.get('cobrosPorFactura');if(m)return m;m=new Map();for(const c of db.cobros){const l=m.get(c.facturaId);if(l)l.push(c);else m.set(c.facturaId,[c])}_cache.set('cobrosPorFactura',m);return m}
let view='dashboard';
function save(){invalidarCache();try{(syncSucio=true,localStorage.setItem(KEY,JSON.stringify(db)));contarCambio();syncProgramar()}catch(e){const lleno=e&&(e.name==='QuotaExceededError'||e.code===22);alert('⚠ LOS DATOS NO SE HAN GUARDADO.\n\n'+(lleno?'El almacenamiento del navegador está lleno (suele deberse a logos o imágenes muy grandes). Borra o reduce logos de clientes / marca de agua y vuelve a intentarlo.':(e?.message||e))+'\n\nSi cierras la app ahora perderás este cambio. Haz una copia de seguridad (Menú → Copias de seguridad).')}render();}
const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',useGrouping:'always'}).format(Number(n)||0);
const date=d=>{if(!d)return '—';const mm=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d));const o=mm?new Date(+mm[1],+mm[2]-1,+mm[3]):new Date(d);return isNaN(o.getTime())?'—':o.toLocaleDateString('es-ES')};
function maxNum(prefix,arr,extra){extra=extra||[];let nums=[...(arr||[]).map(x=>x.numero),...extra].map(x=>String(x||'')).filter(x=>x.startsWith(prefix)).map(x=>Number(x.slice(prefix.length))||0);return (nums.length?Math.max(...nums):0)+1}
function nextPresupuestoNum(){return 'P-'+String(maxNum('P-',db.presupuestos,(db.borrados||[]).filter(x=>x.tipo==='presupuesto').map(x=>x.registro&&x.registro.numero))).padStart(4,'0')}
function nextFacturaNum(fecha){let year=/^\d{4}/.test(String(fecha||''))?Number(String(fecha).slice(0,4)):new Date().getFullYear();let prefix=year+'-';let nums=[...(db.facturas||[]).map(f=>f.numero),...(db.borrados||[]).filter(x=>x.tipo==='factura').map(x=>x.registro&&x.registro.numero)].map(n=>String(n||'')).filter(n=>n.startsWith(prefix)).map(n=>Number(n.slice(prefix.length))||0);let next=(nums.length?Math.max(...nums):0)+1;return prefix+String(next).padStart(4,'0')}
function avisoFechaFactura(fecha){const y=String(fecha||'').slice(0,4);const ult=(db.facturas||[]).filter(f=>String(f.fecha||'').slice(0,4)===y).map(f=>String(f.fecha||'')).sort().pop();return (ult&&fecha<ult)?'La fecha ('+date(fecha)+') es anterior a la de la última factura del año ('+date(ult)+'). La numeración de facturas debe ser correlativa con las fechas. ¿Crear la factura igualmente?':''}
function nextTrabajoNum(){return 'T-'+String(maxNum('T-',db.trabajos,(db.borrados||[]).filter(x=>x.tipo==='trabajo').map(x=>x.registro&&x.registro.numero))).padStart(4,'0')}
function nextCobroNum(){return 'C-'+String(maxNum('C-',db.cobros,(db.borrados||[]).filter(x=>x.tipo==='cobro').map(x=>x.registro&&x.registro.numero))).padStart(4,'0')}
function nextCompraNum(){return 'CO-'+String(maxNum('CO-',db.compras,(db.borrados||[]).filter(x=>x.tipo==='compra').map(x=>x.registro&&x.registro.numero))).padStart(4,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function saldoCliente(id){return round2(saldoClienteRaw(id))}
function saldoClienteRaw(id){let d=db.facturas.filter(x=>x.clienteId===id).reduce((a,x)=>a+Number(x.total||0),0);let h=db.cobros.filter(x=>x.clienteId===id).reduce((a,x)=>a+Number(x.importe||0),0);return d-h}
function buscarCliente(id){if(!id)return null;let r=db.clientes.find(x=>x.id===id);if(r)return Object.assign({},r,{_tipo:'cliente'});r=db.comunidades.find(x=>x.id===id);if(r)return Object.assign({},r,{_tipo:'comunidad'});r=db.administradores.find(x=>x.id===id);if(r)return Object.assign({},r,{_tipo:'administrador'});return null}
function cadenaParte(id){let p=buscarCliente(id);if(!p)return {p:null,c:null,com:null,admin:null};let c=p._tipo==='cliente'?p:null;let com=p._tipo==='comunidad'?p:(c?.comunidadId?db.comunidades.find(x=>x.id===c.comunidadId)||null:null);let admin=p._tipo==='administrador'?p:(com?.administradorId?db.administradores.find(x=>x.id===com.administradorId)||null:null);return {p,c,com,admin}}

/* ==== BUSCADOR ADMINISTRACIÓN > FINCA > CLIENTE ==== */
window._bp={adm:'',com:'',cli:''};window._bpCb='';
const BP_NIV=['adm','com','cli'];
function bpNorm(x){return String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function bpCadena(id){let p=buscarCliente(id);if(!p)return {adm:'',com:'',cli:''};if(p._tipo==='administrador')return {adm:p.id,com:'',cli:''};if(p._tipo==='comunidad')return {adm:p.administradorId&&db.administradores.some(a=>a.id===p.administradorId)?p.administradorId:'',com:p.id,cli:''};let com=p.comunidadId?db.comunidades.find(x=>x.id===p.comunidadId):null;return {adm:com&&com.administradorId&&db.administradores.some(a=>a.id===com.administradorId)?com.administradorId:'',com:com?com.id:'',cli:p.id}}
function bpReceptorId(){const b=window._bp;return b.cli||b.com||b.adm||''}
function bpLista(niv){const b=window._bp;if(niv==='adm')return db.administradores;if(niv==='com')return b.adm?db.comunidades.filter(x=>x.administradorId===b.adm):db.comunidades;if(b.com)return db.clientes.filter(x=>x.comunidadId===b.com);if(b.adm){const ids=new Set(db.comunidades.filter(x=>x.administradorId===b.adm).map(x=>x.id));return db.clientes.filter(x=>ids.has(x.comunidadId))}return db.clientes}
function bpBuscar(niv,q){const b=window._bp;const n=bpNorm(q).trim();const filtrado=niv==='adm'?false:(niv==='com'?!!b.adm:!!(b.adm||b.com));if(n.length<2&&!filtrado)return {items:[],total:0,aviso:'Escribe 2 letras para buscar'};let r=[];for(const x of bpLista(niv)){const nom=bpNorm(x.nombre);let rank=-1;if(n.length<2)rank=0;else if(nom.startsWith(n))rank=0;else if(nom.includes(n))rank=1;else if([x.nif,x.dir,x.localidad,x.cp].some(v=>bpNorm(v).includes(n)))rank=2;if(rank>=0)r.push({x,rank})}r.sort((a,c)=>a.rank-c.rank||String(a.x.nombre).localeCompare(String(c.x.nombre),'es'));return {items:r.slice(0,8).map(o=>o.x),total:r.length,aviso:r.length?'':'Sin coincidencias'}}
function bpEtiqueta(niv,x){let t=[];if(niv==='cli'&&x.comunidadId){const c=db.comunidades.find(y=>y.id===x.comunidadId);if(c)t.push('propietario de '+c.nombre)}if(niv==='com'&&x.administradorId){const a=db.administradores.find(y=>y.id===x.administradorId);if(a)t.push(a.nombre)}if(x.nif)t.push(x.nif);if(x.localidad)t.push(x.localidad);return t.join(' · ')}
function bpMostrar(niv){const el=document.getElementById('bp_res_'+niv);if(!el)return;const inp=document.getElementById('bp_'+niv);const r=bpBuscar(niv,inp?inp.value:'');window._bpIdx=-1;if(!r.items.length){el.innerHTML=r.aviso?'<div class="bp-aviso">'+esc(r.aviso)+'</div>':'';return}el.innerHTML=r.items.map((x,i)=>'<div class="bp-it" data-id="'+esc(x.id)+'" onmousedown="event.preventDefault();bpElegir(\''+niv+'\',this.dataset.id)"><b>'+esc(x.nombre)+'</b><span>'+esc(bpEtiqueta(niv,x))+'</span></div>').join('')+(r.total>r.items.length?'<div class="bp-aviso">Hay '+(r.total-r.items.length)+' más: sigue escribiendo para afinar</div>':'')}
function bpLimpiarDesde(niv){const i=BP_NIV.indexOf(niv);for(let k=i;k<BP_NIV.length;k++){window._bp[BP_NIV[k]]='';if(k>i){const e=document.getElementById('bp_'+BP_NIV[k]);if(e)e.value=''}}}

function bpObj(niv,id){return (niv==='adm'?db.administradores:niv==='com'?db.comunidades:db.clientes).find(x=>x.id===id)}
function bpElegir(niv,id){const x=bpObj(niv,id);if(!x)return;const b=window._bp;if(niv==='adm'){if(b.adm!==id){b.adm=id;if(b.com){const c=bpObj('com',b.com);if(!c||c.administradorId!==id){b.com='';b.cli=''}}}}else if(niv==='com'){b.com=id;b.adm=x.administradorId&&bpObj('adm',x.administradorId)?x.administradorId:'';if(b.cli){const c=bpObj('cli',b.cli);if(!c||c.comunidadId!==id)b.cli=''}}else{b.cli=id;const com=x.comunidadId?bpObj('com',x.comunidadId):null;b.com=com?com.id:'';b.adm=com&&com.administradorId&&bpObj('adm',com.administradorId)?com.administradorId:''}bpPintar();bpCambio()}
function bpPintar(){const b=window._bp;for(const n of BP_NIV){const e=document.getElementById('bp_'+n);if(e)e.value=b[n]?(bpObj(n,b[n])?.nombre||''):'';const r=document.getElementById('bp_res_'+n);if(r)r.innerHTML=''}}

function bpKey(e,niv){const el=document.getElementById('bp_res_'+niv);if(!el)return;const its=[...el.querySelectorAll('.bp-it')];if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!its.length){bpMostrar(niv);return}e.preventDefault();let i=window._bpIdx;i=e.key==='ArrowDown'?Math.min(its.length-1,i+1):Math.max(0,i-1);window._bpIdx=i;its.forEach((x,k)=>x.classList.toggle('on',k===i))}else if(e.key==='Enter'){if(its.length){e.preventDefault();const it=its[window._bpIdx>=0?window._bpIdx:0];bpElegir(niv,it.dataset.id)}}else if(e.key==='Escape'){el.innerHTML=''}}
function bpHtml(id,cb){window._bp=bpCadena(id);window._bpCb=cb||'';window._bpIdx=-1;const b=window._bp;const campo=(n,l)=>'<div class="field bp"><label>'+l+'</label><input id="bp_'+n+'" autocomplete="off" placeholder="Buscar…" value="'+esc(b[n]?(bpObj(n,b[n])?.nombre||''):'')+'" oninput="bpInput(\''+n+'\')" onfocus="bpMostrar(\''+n+'\')" onkeydown="bpKey(event,\''+n+'\')"><div class="bp-res" id="bp_res_'+n+'"></div></div>';const p=buscarCliente(bpReceptorId());const info=p?'Dirigido a: <b>'+esc(p.nombre)+'</b> ('+(p._tipo==='administrador'?'administración':p._tipo==='comunidad'?'finca':'cliente')+')'+(p.nif?' — '+esc(p.nif):''):'Elige a quién va dirigido: administración, finca o cliente.';return campo('adm','Administración')+campo('com','Finca')+campo('cli','Cliente')+'<input type="hidden" id="clienteId" value="'+esc(bpReceptorId())+'"><div class="field full smallnote" id="bpInfo">'+info+'</div>'}

function ym(d){return (d||'').slice(0,7)}

function monthLabel(m){if(!m)return '';let [y,n]=m.split('-');return new Date(Number(y),Number(n)-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'})}
function facturadoMes(m){return db.facturas.filter(f=>ym(f.fecha)===m).reduce((a,f)=>a+Number(f.total||0),0)}
function cobradoMes(m){return db.cobros.filter(c=>ym(c.fecha)===m).reduce((a,c)=>a+Number(c.importe||0),0)}

function pendienteAcumulado(){return db.facturas.reduce((a,f)=>{let cob=totalCobradoFactura(f);return a+Math.max(0,Number(f.total||0)-cob)},0)}
function pendienteAlCierreMes(m){return db.facturas.filter(f=>String(f.fecha||'').slice(0,7)<=m).reduce((a,f)=>a+Math.max(0,Number(f.total||0)-(cobrosPorFactura().get(f.id)||[]).filter(c=>String(c.fecha||'').slice(0,7)<=m).reduce((x,c)=>x+Number(c.importe||0),0)),0)}
function ivaTrimestreDeFecha(fecha){if(!fecha)return '';let d=new Date(String(fecha)+'T00:00:00');if(isNaN(d.getTime()))return '';let q=Math.floor(d.getMonth()/3)+1;return d.getFullYear()+'-T'+q}
function trimestreLabel(t){let m=String(t||'').match(/^(\d{4})-T([1-4])$/);return m?('T'+m[2]+' '+m[1]):t}
function mesesDelTrimestre(t){let m=String(t||'').match(/^(\d{4})-T([1-4])$/);if(!m)return [];let y=Number(m[1]),q=Number(m[2]);let meses=[];for(let i=0;i<3;i++){let mesNum=(q-1)*3+i+1;meses.push(y+'-'+String(mesNum).padStart(2,'0'))}return meses}
function trimestresIva(){let set=new Set();db.facturas.forEach(x=>{let t=ivaTrimestreDeFecha(x.fecha);if(t)set.add(t)});db.compras.forEach(x=>{let t=ivaTrimestreDeFecha(x.fecha);if(t)set.add(t)});db.gastos.forEach(x=>{let t=ivaTrimestreDeFecha(x.fecha);if(t)set.add(t)});db.ivaPagos.forEach(x=>{let t=x.trimestre||ivaTrimestreDeFecha(x.fecha);if(t)set.add(t)});set.add(ivaTrimestreDeFecha(currentYM()+'-01'));return [...set].filter(Boolean).sort()}
function ivaVentasMes(m){return round2(db.facturas.filter(f=>ym(f.fecha)===m).reduce((a,f)=>a+(Number(f.base||0)>0?Number(f.total||0)-Number(f.base||0):Number(f.iva||0)),0))}
function ivaComprasMes(m){return round2(db.compras.filter(c=>ym(c.fecha)===m).reduce((a,c)=>a+Number(c.iva||0),0)+db.gastos.filter(g=>ym(g.fecha)===m&&g.tomaIva).reduce((a,g)=>a+Number(g.iva||0),0))}
function ivaVentasTrimestre(t){return mesesDelTrimestre(t).reduce((a,m)=>a+ivaVentasMes(m),0)}
function ivaComprasTrimestre(t){return mesesDelTrimestre(t).reduce((a,m)=>a+ivaComprasMes(m),0)}
function ivaPagoTrimestre(t){return db.ivaPagos.filter(x=>(x.trimestre||ivaTrimestreDeFecha(x.fecha))===t).reduce((a,x)=>a+Number(x.importe||0),0)}
function liquidacionesIva(){let trims=trimestresIva();let arrastre=0;return trims.map(t=>{let ventas=ivaVentasTrimestre(t);let compras=ivaComprasTrimestre(t);let resultado=ventas-compras;let pagado=ivaPagoTrimestre(t);let resultadoConArrastre=resultado-arrastre;let aPagar=Math.max(0,resultadoConArrastre);let aFavor=Math.max(0,-resultadoConArrastre);let pendiente=Math.max(0,aPagar-pagado);let arrastreEntrante=arrastre;arrastre=aFavor;return {trimestre:t,ventas,compras,resultado,pagado,pendiente,aFavor,arrastreEntrante,aPagar}})}
function liquidacionDelTrimestre(t){let arr=0;for(const liq of liquidacionesIva()){if(liq.trimestre===t)return {...liq,arrastreEntrante:arr};arr=liq.aFavor}return {trimestre:t,ventas:ivaVentasTrimestre(t),compras:ivaComprasTrimestre(t),resultado:ivaVentasTrimestre(t)-ivaComprasTrimestre(t),pagado:ivaPagoTrimestre(t),pendiente:0,aFavor:0,arrastreEntrante:arr,aPagar:0}}
function ivaPagadoTotal(){return db.ivaPagos.reduce((a,x)=>a+Number(x.importe||0),0)}
function ivaFavorTotal(){let liqs=liquidacionesIva();return liqs.length?liqs[liqs.length-1].aFavor:0}

function cuotaAutonomoMes(m){const h=(db.empresa.cuotasAutonomo||[]).filter(x=>x.desde&&x.desde<=m).sort((a,b)=>a.desde<b.desde?-1:(a.desde>b.desde?1:0));return h.length?round2(Number(h[h.length-1].importe)||0):0}
function beneficioMes(m){return round2(baseFacturadaMes(m)-costeMaterialesMes(m)-gastosMes(m)-cuotaAutonomoMes(m))}
function sumaAnioHasta(m,fn){let t=0;for(let i=1;i<=Number(m.slice(5,7));i++)t+=fn(m.slice(0,4)+'-'+String(i).padStart(2,'0'));return round2(t)}

function mesFinDatos(){const u=db.facturas.map(f=>ym(f.fecha)).filter(Boolean).sort().pop()||'';return u>currentYM()?u:currentYM()}

function itemsDeFactura(f){const ps=Array.isArray(f.pSnapshots)?f.pSnapshots:(f.pSnapshot?[f.pSnapshot]:null);const itP=ps?ps.flatMap(p=>p.items||[]):(f.items||[]);const jobs=f.jobsSnapshot||trabajosDeFactura(f)||[];return [...itP,...jobs.flatMap(j=>j.items||[])]}
function costeUnitarioItem(x){if(x.costeCompra!=null&&isFinite(Number(x.costeCompra)))return Number(x.costeCompra);const m=db.materiales.find(z=>z.id===x.materialId);return Number(m?.precioCompra||0)}
function margenFactura(f){let costeMat=0;itemsDeFactura(f).forEach(x=>{costeMat+=Number(x.cantidad||0)*costeUnitarioItem(x)});let base=Number(f.base||0);if(!(base>0))base=Number(f.total||0)-Number(f.iva||0);return round2(base-costeMat)}
function baseFacturadaMes(m){return round2(db.facturas.filter(f=>ym(f.fecha)===m).reduce((a,f)=>a+Number(f.base||0),0))}
function irpfReservaMes(m){const prev=Number(m.slice(5,7))===1?0:irpfAcumAnio(mesDesplazado(m,-1));return round2(irpfAcumAnio(m)-prev)}
function pagadoGastosMes(m){return round2(db.gastos.filter(g=>ym(g.fecha)===m).reduce((a,g)=>a+Number(g.importe||0)+Number(g.iva||0),0))}
function comprasMes(m){return round2(db.compras.filter(c=>ym(c.fecha)===m).reduce((a,c)=>a+Number(c.total||0),0))}
function ivaPagosMes(m){return round2(db.ivaPagos.filter(x=>ym(x.fecha)===m).reduce((a,x)=>a+Number(x.importe||0),0))}

function pagoIrpfTrim(x){return x.trimestre||ivaTrimestreDeFecha(x.fecha)}
function irpfTrimestre(t){const mt=String(t).match(/^(\d{4})-T([1-4])$/);const y=mt[1];const meses=mesesDelTrimestre(t);let fin=meses[meses.length-1];if(fin>currentYM())fin=currentYM()<meses[0]?fin:currentYM();
  const facturado=sumaAnioHasta(fin,baseFacturadaMes),materiales=sumaAnioHasta(fin,costeMaterialesMes),gastos=sumaAnioHasta(fin,gastosMes),cuotas=sumaAnioHasta(fin,cuotaAutonomoMes);
  const beneficio=round2(facturado-materiales-gastos-cuotas),teorico=round2(Math.max(0,beneficio)*irpfPct()/100);
  const pagos=(db.irpfPagos||[]).filter(x=>String(pagoIrpfTrim(x)).slice(0,4)===y);
  const anteriores=round2(pagos.filter(x=>pagoIrpfTrim(x)<t).reduce((a,x)=>a+Number(x.importe||0),0)),pagado=round2(pagos.filter(x=>pagoIrpfTrim(x)===t).reduce((a,x)=>a+Number(x.importe||0),0));
  const aPagar=Math.max(0,round2(teorico-anteriores)),pendiente=Math.max(0,round2(aPagar-pagado));
  return {trimestre:t,facturado,materiales,gastos,cuotas,beneficio,teorico,anteriores,pagado,aPagar,pendiente,estado:aPagar<=0?'Sin pago':(pendiente<=0?'Pagado':'Pendiente')}}
function trimestresIrpf(){const set=new Set([ivaTrimestreDeFecha(currentYM()+'-01')]);const add=f=>{const t=ivaTrimestreDeFecha(f);if(t)set.add(t)};db.facturas.forEach(x=>add(x.fecha));db.gastos.forEach(x=>add(x.fecha));(db.irpfPagos||[]).forEach(x=>set.add(pagoIrpfTrim(x)));
  const c=(db.empresa.cuotasAutonomo||[]).map(x=>x.desde).sort()[0];if(c){let m=c,g=0;while(m<=currentYM()&&g<600){add(m+'-01');m=mesDesplazado(m,1);g++}}return [...set].filter(Boolean).sort().reverse()}
function cuotaTramos(base,tr){let t=0;for(let i=0;i<tr.length;i++){const d=Number(tr[i][0]),n=tr[i+1]?Number(tr[i+1][0]):Infinity;if(base>d)t+=(Math.min(base,n)-d)*Number(tr[i][1])/100}return t}
function rentaEstimada(base){const E=db.empresa,min=Number(E.minimoPersonal)||0,f=b=>cuotaTramos(b,E.tramosEstatal)+cuotaTramos(b,E.tramosAutonomico);base=Math.max(0,Number(base)||0);return Math.max(0,round2(f(base)-f(Math.min(base,min))))}
function tipoMarginal(tr,b){let t=Number(tr[0][1]);tr.forEach(r=>{if(b>=Number(r[0]))t=Number(r[1])});return t}
function tramoInfo(base){const E=db.empresa;base=Math.max(0,Number(base)||0);const um=[...new Set([...E.tramosEstatal,...E.tramosAutonomico].map(r=>Number(r[0])))].sort((a,b)=>a-b);let desde=0;um.forEach(u=>{if(base>=u)desde=u});const sig=um.find(u=>u>base);return {desde,siguiente:sig===undefined?null:sig,falta:sig===undefined?null:round2(sig-base),tipo:round2(tipoMarginal(E.tramosEstatal,base)+tipoMarginal(E.tramosAutonomico,base)),tipoSiguiente:sig===undefined?null:round2(tipoMarginal(E.tramosEstatal,sig)+tipoMarginal(E.tramosAutonomico,sig))}}
function previsionAnio(y){return Number((db.empresa.previsionAnual||{})[y])||0}
function estimacionAnual(y){y=y||currentYM().slice(0,4);const fin=(y+'-12')>currentYM()?currentYM():(y+'-12'),real=fin.slice(0,4)===y?beneficioAcumAnio(fin):0,prev=previsionAnio(y),base=Math.max(real,prev),renta=rentaEstimada(base);
  const pagado=round2((db.irpfPagos||[]).filter(x=>String(pagoIrpfTrim(x)).slice(0,4)===y).reduce((a,x)=>a+Number(x.importe||0),0));
  return {anio:y,real,prevision:prev,base,renta,pagado,resultado:round2(renta-pagado),tramo:tramoInfo(base)}}
function saveIrpfPrevision(){const y=currentYM().slice(0,4);const v=val('irpf_prevision');db.empresa.previsionAnual=db.empresa.previsionAnual||{};if(v===''||!isFinite(Number(v))||Number(v)<0)delete db.empresa.previsionAnual[y];else db.empresa.previsionAnual[y]=round2(Number(v));save()}

function tipoSS(){return Number(db.empresa.tipoSS)||0}
function tramoSS(r){const t=db.empresa.tramosSS;let f=t[0];t.forEach(x=>{if(r>=Number(x[0]))f=x});return f}
function hayCuotaSS(){return (db.empresa.cuotasAutonomo||[]).length>0}
function beneficioSinCuotaMes(m){return round2(baseFacturadaMes(m)-costeMaterialesMes(m)-gastosMes(m))}
function mesesEntre(a,b){return (Number(b.slice(0,4))-Number(a.slice(0,4)))*12+Number(b.slice(5,7))-Number(a.slice(5,7))+1}
function inicioActividadAnio(y){if(!hayCuotaSS())return null;const c=db.empresa.cuotasAutonomo.map(x=>x.desde).sort()[0];if(c>y+'-12')return null;return c>y+'-01'?c:y+'-01'}

function pvCalc(){

  const auto=(cat,q,why)=>{q=Math.round(q*1000)/1000;if(!(q>0))return;const m=pvMasBarato(cat);if(!m){faltaAuto.push(cat);L.push({sec,falta:true,nombre:cat,q,why});return}L.push({sec,m,q,why})};
  const pick=(id,q,why)=>{const m=pvElegido(id);if(m&&q>0)L.push({sec,m,q,why})};
  const pan=pvN(s.paneles),str=pvN(s.strings),tri=s.fase==='tri',sinInv=s.fase==='no';
  S('Paneles y estructura');
  pick('panel',pan,'1 por panel');auto('Perfil de estructura',pan,'1 por panel');auto('Varilla roscada M8',pan,'1 m por perfil');auto('Taco de anclaje químico',pan*4,'4 por perfil');auto('Tuerca M8',pan*12,'12 por perfil');auto('Arandela M8',pan*12,'12 por perfil');
  auto('Clamp final',pvN(s.clampF),'respuesta');auto('Clamp intermedio',pvN(s.clampI),'respuesta');auto('Taco químico (bote)',pvN(s.quimico),'respuesta');
  S('Inversor, conmutación y cuadros');
  let cuadros=0;
  pick('ita',1,'elegido');
  if(!sinInv){pick('inv',1,'elegido');if(tri){auto('Cuadro 12 bocas',1,'cuadro de alterna');auto('Cuadro 8 bocas',1,'cuadro de continua');cuadros+=2}else{auto('Cuadro 12 bocas',1,'un solo cuadro (monofásica)');cuadros+=1}
    auto('Portafusible',str*2,'2 por string');auto('Fusible solar',str,'1 por string');auto('Cartucho de neutro',str,'1 por string');
    auto(tri?'Magnetotérmico tetrapolar':'Magnetotérmico bipolar',2,'protecciones');auto(tri?'Diferencial tetrapolar':'Diferencial bipolar',1,'protecciones');}
  if(!sinInv||pan>0)auto('Puntera 6 mm',50,'fijo');
  S('Cables y canalización');
  pick('solar',pvN(s.mSolar),'metros');pick('ac',pvN(s.mAC),'metros');
  const tubos=pvN(s.tubos),mc=pvN(s.mCan);let grapas=tubos*6;
  auto('Tubo 32 mm',tubos,'respuesta');auto('Curva corrugada 32 mm',pvN(s.curvasTubo),'respuesta');
  auto('Canaleta (tramo 2 m)',Math.ceil(mc/2),mc+' m en tramos de 2 m');auto('Curva de canaleta',pvN(s.canCurvas),'respuesta');auto('T de canaleta',pvN(s.canT),'respuesta');auto('Tapa final de canaleta',pvN(s.canTapas),'respuesta');
  if(s.bat==='si'){S('Batería');pick('bat',1,'elegida')}
  if(s.car!=='no'){S('Cargador de coche');const ct=s.car==='tri';pick('car',1,'elegido');pick('carCable',pvN(s.carM),'metros');auto('Tubo 32 mm',pvN(s.carTubos),'respuesta');auto('Curva corrugada 32 mm',pvN(s.carCurvas),'respuesta');grapas+=pvN(s.carTubos)*6;
    auto(ct?'Magnetotérmico tetrapolar':'Magnetotérmico bipolar',1,'protección del cargador');auto(ct?'Diferencial tetrapolar':'Diferencial bipolar',1,'protección del cargador');auto(ct?'Cuadro 12 bocas':'Cuadro 8 bocas',1,ct?'12 bocas (trifásico)':'8 bocas (monofásico)');cuadros+=1}
  S('Fijaciones');
  auto('Grapa tubo 32 mm',grapas,'1 cada 50 cm (6 por tubo)');
  auto('Taco y tornillo 6 mm',grapas+cuadros*4+mc*4,grapas+' grapas + '+cuadros+' cuadros × 4 + '+mc+' m de canaleta × 4');
  auto('Taco y tornillo 8 mm',(sinInv?0:4)+(s.bat==='si'?8:0),[sinInv?'':'4 del inversor',s.bat==='si'?'8 de la batería':''].filter(Boolean).join(' + '));
  const faltan=[];if(!s.cliente)faltan.push('Cliente — punto 1');Object.keys(PV_SEL).forEach(id=>{if(pvReq(id)&&!s.sel[id])faltan.push(PV_SEL[id].t+' — '+PV_SEL[id].donde)});
  return {L,faltaAuto:[...new Set(faltaAuto)],faltan,sinInv};
}

function sparkline(pts,color){
  let w=100,h=34,min=Math.min(...pts),max=Math.max(...pts),range=(max-min)||1;
  let stepX=w/(pts.length-1||1);
  let coords=pts.map((v,i)=>[i*stepX,h-4-((v-min)/range)*(h-8)]);
  let line='M'+coords.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L');
  let area=line+' L'+w+','+h+' L0,'+h+' Z';
  let id='sg_'+Math.random().toString(36).slice(2,8);
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".35"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#'+id+')"/>'+
    '<path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
  '</svg>';
}

  let s='<svg class="dsh-linewrap" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
  s+='<defs><linearGradient id="dshAreaF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b82f6" stop-opacity=".28"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs>';
  for(let i=1;i<5;i++){let y=padTop+i*((h-padTop-padBot)/5);s+='<line x1="'+padX+'" y1="'+y+'" x2="'+(w-padX)+'" y2="'+y+'" stroke="#eef2f7" stroke-width="1"/>';}
  s+='<path d="'+areaF+'" fill="url(#dshAreaF)"/>';
  s+='<path d="'+pathF+'" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  s+='<path d="'+pathC+'" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round"/>';

  ];
  const globos=G.map(g=>typeof g[4]==='string'?'<div class="globo" id="gl_'+g[0]+'"><button type="button" class="btn '+g[2]+'" onclick="'+g[4]+'">'+ico(g[3])+g[1]+'</button></div>':'<div class="globo" id="gl_'+g[0]+'"><button type="button" class="btn '+g[2]+'" onclick="toggleGlobo(\'gl_'+g[0]+'\',event)">'+ico(g[3])+g[1]+' <span class="chev">▾</span></button>'+popHtml(g[4],g[5])+'</div>').join('');

function modalComunidad(c){c=c||null;window.editingComunidadId=c?.id||null;let optsAdmin='<option value="">— Sin administrador —</option>'+db.administradores.map(a=>'<option value="'+esc(a.id)+'" '+(a.id===c?.administradorId?'selected':'')+'>'+esc(a.nombre)+'</option>').join('');modal(c?'Editar comunidad':'Nueva comunidad','<div class="formgrid"><div class="field"><label>Nombre</label><input id="nombre" value="'+esc(c?.nombre||'')+'"></div><div class="field"><label>NIF/CIF</label><input id="nif" value="'+esc(c?.nif||'')+'"></div><div class="field"><label>IBAN</label><input id="iban" value="'+esc(c?.iban||'')+'"></div><div class="field"><label>Administrador</label><select id="administradorId">'+optsAdmin+'</select></div><div class="field full"><label>Dirección</label><input id="dir" value="'+esc(c?.dir||'')+'"></div><div class="field"><label>Localidad</label><input id="localidad" value="'+esc(c?.localidad||'')+'"></div><div class="field"><label>Código postal</label><input id="cp" value="'+esc(c?.cp||'')+'"></div><div class="field"><label>Contacto</label><input id="contacto" value="'+esc(c?.contacto||'')+'"></div><div class="field"><label>Teléfono</label><input id="tel" value="'+esc(c?.tel||'')+'"></div><div class="field"><label>Email</label><input id="email" value="'+esc(c?.email||'')+'"></div><div class="field full"><label>Observaciones</label><textarea id="obs">'+esc(c?.obs||'')+'</textarea></div></div>','saveComunidad()')}

function editComunidad(id){let c=db.comunidades.find(x=>x.id===id);if(c)modalComunidad(c)}
function verComunidad(id){let c=db.comunidades.find(x=>x.id===id);if(!c)return;let admin=c.administradorId?db.administradores.find(a=>a.id===c.administradorId):null;let propietarios=db.clientes.filter(x=>x.comunidadId===id);let trabajos=db.trabajos.filter(t=>{if(t.clienteId===id)return true;let cl=db.clientes.find(x=>x.id===t.clienteId);return cl&&cl.comunidadId===id});let facturas=db.facturas.filter(f=>{if(f.clienteId===id)return true;let cl=db.clientes.find(x=>x.id===f.clienteId);return cl&&cl.comunidadId===id});let html='<p><b>Nombre:</b> '+esc(c.nombre)+'</p><p><b>NIF/CIF:</b> '+esc(c.nif||'—')+'</p><p><b>IBAN:</b> '+esc(c.iban||'—')+'</p><p><b>Administrador:</b> '+esc(admin?admin.nombre:'—')+'</p><p><b>Dirección:</b> '+esc(c.dir||'')+' '+esc(c.cp||'')+' '+esc(c.localidad||'')+'</p><p><b>Contacto:</b> '+esc(c.contacto||'—')+' · '+esc(c.tel||'—')+' · '+esc(c.email||'—')+'</p><p><b>Observaciones:</b> '+esc(c.obs||'')+'</p>';html+='<h3>Propietarios ('+propietarios.length+')</h3>';html+='<div class="actions" style="justify-content:flex-start;margin-bottom:8px"><button class="btn small primary" onclick="closeModal();modalClienteConComunidad(\''+id+'\')">+ Añadir propietario</button></div>';html+=propietarios.length?'<div class="tablewrap"><table class="table"><tr><th>Nombre</th><th>NIF/CIF</th><th>Dirección</th><th>Teléfono</th><th>Acciones</th></tr>'+propietarios.map(p=>'<tr><td>'+esc(p.nombre)+'</td><td>'+esc(p.nif||'')+'</td><td>'+esc(p.dir||'')+'</td><td>'+esc(p.tel||'')+'</td><td><button class="btn small" onclick="closeModal();editCliente(\''+p.id+'\')">Editar</button></td></tr>').join('')+'</table></div>':'<div class="empty">Sin propietarios.</div>';html+='<h3>Trabajos ('+trabajos.length+')</h3>';html+=trabajos.length?'<div class="tablewrap"><table class="table"><tr><th>Nº</th><th>Cliente</th><th>Fecha</th><th>Total</th></tr>'+trabajos.map(t=>'<tr><td>'+esc(t.numero)+'</td><td>'+esc(clientName(t.clienteId))+'</td><td>'+date(t.fecha)+'</td><td>'+money(t.costeTotal)+'</td></tr>').join('')+'</table></div>':'<div class="empty">Sin trabajos.</div>';html+='<h3>Facturas ('+facturas.length+')</h3>';html+=facturas.length?'<div class="tablewrap"><table class="table"><tr><th>Nº</th><th>Receptor</th><th>Fecha</th><th>Total</th></tr>'+facturas.map(f=>'<tr><td>'+esc(f.numero)+'</td><td>'+esc(receptorName(f))+'</td><td>'+date(f.fecha)+'</td><td>'+money(f.total)+'</td></tr>').join('')+'</table></div>':'<div class="empty">Sin facturas.</div>';modal('Comunidad: '+c.nombre,html,'closeModal()')}

function modalCliente(c,comunidadPreseleccionada){c=c||null;window._campoPend=null;window.editingClienteId=c?.id||null;window.eliminarLogoCliente=false;let cid=c?.comunidadId||comunidadPreseleccionada||'';let optsCom='<option value="">— Cliente particular (sin comunidad) —</option>'+db.comunidades.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===cid?'selected':'')+'>'+esc(x.nombre)+'</option>').join('');modal(c?'Editar cliente':'Nuevo cliente','<div class="formgrid"><div class="field"><label>Nombre / empresa</label><input id="nombre" value="'+esc(c?.nombre||'')+'"></div><div class="field"><label>NIF/CIF</label><input id="nif" value="'+esc(c?.nif||'')+'"></div><div class="field full"><label>Comunidad (si es propietario)</label><select id="comunidadId">'+optsCom+'</select></div><div class="field"><label>Teléfono</label><input id="tel" value="'+esc(c?.tel||'')+'"></div><div class="field"><label>Email</label><input id="email" value="'+esc(c?.email||'')+'"></div><div class="field"><label>IBAN</label><input id="iban" value="'+esc(c?.iban||'')+'"></div><div class="field full"><label>Dirección</label><input id="dir" value="'+esc(c?.dir||'')+'"></div><div class="field"><label>Localidad</label><input id="localidad" value="'+esc(c?.localidad||'')+'"></div><div class="field"><label>Código postal</label><input id="cp" value="'+esc(c?.cp||'')+'"></div><div class="field full"><label>Foto / logo del cliente</label><input id="cliente_logo" type="file" accept="image/png,image/jpeg,image/webp,image/*">'+(c?.logo?'<div style="margin-top:8px;background:repeating-conic-gradient(#e5e7eb 0% 25%, #ffffff 0% 50%) 50% / 12px 12px;padding:6px;border-radius:6px;display:inline-block"><img src="'+esc(c.logo)+'" style="max-width:150px;max-height:75px;object-fit:contain;display:block" alt="Logo del cliente"></div><br><button type="button" class="btn small danger" style="margin-top:6px" onclick="eliminarLogoClienteActual()">Borrar foto / logo</button>':'')+'</div><div class="field full"><label>Observaciones</label><textarea id="obs">'+esc(c?.obs||'')+'</textarea></div></div>','addClient()')}
function eliminarLogoClienteActual(){window.eliminarLogoCliente=true;let input=document.getElementById('cliente_logo');if(input)input.value='';alert('La foto / logo del cliente se eliminará al guardar.')}
async function addClient(){let existing=db.clientes.find(x=>x.id===window.editingClienteId);let logo=window.eliminarLogoCliente?'':(existing?.logo||'');let file=document.getElementById('cliente_logo')?.files?.[0];if(file){logo=await resizePhoto(file,600,300,true,600000);window.eliminarLogoCliente=false}let data={nombre:val('nombre'),nif:val('nif'),comunidadId:val('comunidadId'),tel:val('tel'),email:val('email'),iban:val('iban'),dir:val('dir'),localidad:val('localidad'),cp:val('cp'),obs:val('obs'),logo};if(!data.nombre.trim()){alert('El nombre del cliente es obligatorio.');return}if(existing){let before=JSON.parse(JSON.stringify(existing));Object.assign(existing,data);recordModification('cliente',before,existing)}else{const _nid=generarId();db.clientes.push({id:_nid,...data});if(window._campoPend){const _cp=window._campoPend;window._campoPend=null;window.editingClienteId=null;closeModal();save();const _c=campoLista().find(x=>x.id===_cp);if(_c)setTimeout(()=>campoAbrirPresupuesto(_c,_nid),60);return}}window.editingClienteId=null;closeModal();save()}

function proveedores(){let body=db.proveedores.length?'<div class="tablewrap"><table class="table"><tr><th>Distribuidor</th><th>Email</th><th>Teléfono</th><th>Dirección</th><th>Localidad</th><th>Catálogo</th><th>Acciones</th></tr>'+db.proveedores.map(v=>'<tr><td>'+esc(v.nombre)+'</td><td>'+esc(v.email)+'</td><td>'+esc(v.tel)+'</td><td>'+esc(v.dir)+'</td><td>'+esc(v.localidad)+'</td><td>'+catResumenHtml(v.id)+'</td><td><button class="btn small" onclick="catAbrir(\''+v.id+'\')">Catálogo</button> <button class="btn small" onclick="catImportar(\''+v.id+'\')">Importar lista</button> <button class="btn small" onclick="editProveedor(\''+v.id+'\')">Editar</button> <button class="btn small danger" onclick="del(\'proveedor\',\''+v.id+'\')">Eliminar</button></td></tr>').join('')+'</table></div>':'<div class="empty">No hay distribuidores todavía.</div>';return shell('<div class="toolbar"><input class="search" placeholder="Buscar distribuidor..." oninput="filterRows(this)"><button class="btn primary" onclick="modalProveedor()">+ Nuevo distribuidor</button></div><div id="list">'+body+'</div>','Distribuidores','Tus proveedores habituales y sus datos de contacto')}

function editProveedor(id){let v=db.proveedores.find(x=>x.id===id);if(v)modalProveedor(v)}
function materiales(){const grupos={};db.materiales.forEach(m=>{if(m.grupoEq)(grupos[m.grupoEq]=grupos[m.grupoEq]||[]).push(m)});const celdaProv=m=>{const L=m.proveedores||[];const u=L.find(p=>p.proveedorId===m.proveedorId);let t=m.proveedorId?esc(proveedorName(m.proveedorId)):'—';if(u&&urlSegura(u.url))t+=' <a href="'+esc(u.url)+'" target="_blank" rel="noopener">Web</a>';if(L.length>1)t+='<br><span class="smallnote">+'+(L.length-1)+' distribuidor'+(L.length>2?'es':'')+' más</span>';return t};const celdaEq=m=>{const o=m.grupoEq?(grupos[m.grupoEq]||[]).filter(x=>x.id!==m.id):[];return o.length?'<span class="smallnote">'+o.map(x=>esc(x.nombre)).join('<br>')+'</span>':'—'};let body=db.materiales.length?'<div class="tablewrap"><table class="table"><tr><th>Código</th><th>Material</th><th>Distribuidor que uso</th><th>Precio compra</th><th>Precio venta</th><th>Stock</th><th>Mínimo</th><th>Valor sin IVA</th><th>Equivalentes</th><th>Acciones</th></tr>'+db.materiales.map(m=>'<tr><td>'+esc(m.codigo)+'</td><td>'+esc(m.nombre)+'</td><td>'+celdaProv(m)+'</td><td>'+money(m.precioCompra)+(pendientesDe(m).length?pendientesDe(m).map(p=>'<br><span class="stockwarn">'+esc(p.proveedorId?proveedorName(p.proveedorId):'Compra')+': '+esc(precioTxt(p.precioCompra))+'</span>').join('')+'<br><button class="btn small" onclick="revisarPendiente(\''+m.id+'\')">Revisar</button>':'')+'</td><td>'+money(m.precio)+'</td><td class="'+((Number(m.stock)<0||(Number(m.stock)<=Number(m.minStock||0)&&Number(m.minStock||0)>0))?'stockwarn':'')+'">'+esc(m.stock)+'</td><td>'+esc(m.minStock||0)+'</td><td>'+money(round2(Math.max(0,Number(m.stock||0))*Number(m.precioCompra||0)))+'</td><td>'+celdaEq(m)+'</td><td><button class="btn small" onclick="editMaterial(\''+m.id+'\')">Editar</button> <button class="btn small danger" onclick="del(\'material\',\''+m.id+'\')">Eliminar</button></td></tr>').join('')+'</table></div>':'<div class="empty">No hay materiales todavía.</div>';return shell('<div class="toolbar"><input class="search" placeholder="Buscar material..." oninput="filterRows(this)"><div class="card" style="padding:9px 14px;display:flex;gap:10px;align-items:center"><span class="label" style="margin:0">Total de materiales</span><b>'+money(round2(db.materiales.reduce((a,m)=>a+Math.max(0,Number(m.stock||0))*Number(m.precioCompra||0),0)))+'</b></div></div><div id="list">'+body+'</div>','Materiales')}
function modalMaterial(m){m=m||null;window.editingMaterialId=m?.id||null;window._matProv=(Array.isArray(m?.proveedores)&&m.proveedores.length?m.proveedores:(m?.proveedorId?[{proveedorId:m.proveedorId,codigo:m.codigo||'',precioCompra:Number(m.precioCompra)||0,url:''}]:[])).map(x=>({...x}));window._matUso=Math.max(0,window._matProv.findIndex(x=>x.proveedorId===m?.proveedorId));window._matEq=(m&&m.id&&m.grupoEq)?db.materiales.filter(x=>x.id!==m.id&&x.grupoEq===m.grupoEq).map(x=>x.id):[];modal(m&&m.id?'Editar material':'Nuevo material','<div class="formgrid"><div class="field"><label>Código / ID</label><input id="codigo" value="'+esc(m?.codigo||'')+'"></div><div class="field"><label>Material</label><input id="nombre" value="'+esc(m?.nombre||'')+'"></div><div class="field"><label>Unidad</label><input id="unidad" value="'+esc(m?.unidad||'ud')+'"></div><div class="field"><label>Categoría (para el presupuesto solar)</label><select id="categoria">'+categoriaOpts(m?.categoria||'')+'</select></div><div class="field"><label>Precio compra sin IVA (€)</label><input id="precioCompra" type="number" step="any" value="'+(m?.precioCompra??0)+'"><div class="smallnote" id="pcNota" style="margin-top:4px"></div></div><div class="field"><label>% IVA compra</label><input id="ivaCompraPct" type="number" step="0.01" value="'+(m?.ivaCompraPct??21)+'"></div><div class="field"><label>Precio venta sin IVA (€)</label><input id="precio" type="number" step="any" value="'+(m?.precio??0)+'"></div><div class="field"><label>Cantidad</label><input id="stock" type="number" step="any" value="'+(m?.stock??0)+'"></div><div class="field"><label>Stock mínimo</label><input id="minStock" type="number" step="any" value="'+(m?.minStock??0)+'"></div><div class="field full"><label>Distribuidores donde lo compras</label><div class="smallnote" style="margin-bottom:6px">Cada distribuidor con su código, su precio y su enlace. El marcado como «el que uso» da el precio de compra (el coste para calcular tu ganancia).</div><div id="matProv"></div></div><div class="field full"><label>Equivalentes</label><div class="smallnote" style="margin-bottom:6px">Otros materiales que sirven para lo mismo (otra marca o modelo). Cada uno tiene su propio stock y su propio precio.</div><div id="matEq"></div><div style="margin-top:10px"><label for="matEqNombre">Nombre del grupo</label><input id="matEqNombre" value="'+esc(m?.nombreGrupo||'')+'" placeholder="Ej.: Bornas de conexión"><div class="smallnote" style="margin-top:4px">En presupuestos, partes y facturas los equivalentes salen juntos en un renglón con este nombre (si lo dejas vacío, el del más caro). Si mezclas precios, se cobra el más alto.</div></div></div></div>','saveMaterial()');matProvPintar();matEqPintar()}
function urlSegura(u){return /^https?:\/\/[^\s"'<>]+$/i.test(String(u||'').trim())}
function matProvPintar(){const el=document.getElementById('matProv');if(!el)return;const L=window._matProv;if(window._matUso>=L.length)window._matUso=0;const opts=sel=>'<option value="">— Elegir —</option>'+db.proveedores.map(v=>'<option value="'+esc(v.id)+'" '+(v.id===sel?'selected':'')+'>'+esc(v.nombre)+'</option>').join('')+(sel&&!db.proveedores.some(v=>v.id===sel)?'<option value="'+esc(sel)+'" selected>(distribuidor borrado)</option>':'');el.innerHTML=(L.length?'<div class="tablewrap"><table class="table"><tr><th></th><th>El que uso</th><th>Distribuidor</th><th>Su código</th><th>Precio compra sin IVA (€)</th><th>Enlace a la web</th></tr>'+L.map((x,i)=>'<tr><td><button type="button" class="btn small danger" title="Quitar este distribuidor" onclick="matProvQuitar('+i+')">🗑</button></td><td><input type="radio" name="matUso" style="width:auto" '+(i===window._matUso?'checked':'')+' onchange="matProvUso('+i+')"></td><td><select style="min-width:140px" onchange="matProvSet('+i+',\'proveedorId\',this.value)">'+opts(x.proveedorId)+'</select></td><td><input style="width:110px" value="'+esc(x.codigo||'')+'" oninput="matProvSet('+i+',\'codigo\',this.value)"></td><td><input style="width:110px" type="number" min="0" step="any" value="'+esc(x.precioCompra??'')+'" oninput="matProvSet('+i+',\'precioCompra\',this.value)"></td><td><input style="width:200px" type="url" placeholder="https://..." value="'+esc(x.url||'')+'" oninput="matProvSet('+i+',\'url\',this.value)">'+(urlSegura(x.url)?' <a href="'+esc(x.url)+'" target="_blank" rel="noopener">Abrir</a>':'')+'</td></tr>').join('')+'</table></div>':'<div class="smallnote">Sin distribuidores todavía.</div>')+'<div class="actions" style="justify-content:flex-start;margin-top:8px"><button type="button" class="btn small" onclick="matProvAnadir()">+ Añadir distribuidor</button></div>';matProvSync()}
function matProvSync(){const pc=document.getElementById('precioCompra');if(!pc)return;const u=window._matProv[window._matUso];if(u){pc.value=Number(u.precioCompra)||0;pc.readOnly=true}else pc.readOnly=false;const n=document.getElementById('pcNota');if(n)n.textContent=u?'Sale del distribuidor marcado como «el que uso».':''}
function matProvSet(i,k,v){const x=window._matProv[i];if(!x)return;x[k]=v;if(i===window._matUso&&k==='precioCompra')matProvSync()}
function matProvUso(i){window._matUso=i;matProvSync()}
function matProvAnadir(){const L=window._matProv;L.push({proveedorId:'',codigo:L.length?'':val('codigo'),precioCompra:L.length?'':(Number(val('precioCompra'))||0),url:''});matProvPintar()}
function matProvQuitar(i){const x=window._matProv[i];if(!x)return;if(x.proveedorId&&!confirm('¿Quitar el distribuidor «'+proveedorName(x.proveedorId)+'» de este material?'))return;window._matProv.splice(i,1);if(i<window._matUso)window._matUso--;else if(i===window._matUso)window._matUso=0;matProvPintar()}
function matEqPintar(){const el=document.getElementById('matEq');if(!el)return;const ids=window._matEq,yo=window.editingMaterialId;const lista=ids.map(id=>db.materiales.find(x=>x.id===id)).filter(Boolean);const disp=db.materiales.filter(x=>x.id!==yo&&!ids.includes(x.id));el.innerHTML=(lista.length?'<div class="tablewrap"><table class="table"><tr><th>Código</th><th>Material</th><th>Precio venta sin IVA</th><th>Stock</th><th></th></tr>'+lista.map(x=>'<tr><td>'+esc(x.codigo)+'</td><td>'+esc(x.nombre)+'</td><td>'+money(x.precio)+'</td><td>'+esc(x.stock)+'</td><td><button type="button" class="btn small danger" onclick="matEqQuitar(\''+x.id+'\')">Quitar</button></td></tr>').join('')+'</table></div>':'<div class="smallnote">Sin equivalentes.</div>')+(disp.length?'<div style="display:flex;gap:8px;margin-top:8px"><select id="matEqSel" style="flex:1"><option value="">— Elegir material —</option>'+disp.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.codigo)+' — '+esc(x.nombre)+'</option>').join('')+'</select><button type="button" class="btn small" onclick="matEqAnadir()">+ Añadir equivalente</button></div>':'')}
function matEqAnadir(){const id=val('matEqSel');if(!id)return;const x=db.materiales.find(m=>m.id===id);if(!x)return;const set=new Set(window._matEq);set.add(id);if(x.grupoEq)db.materiales.forEach(m=>{if(m.grupoEq===x.grupoEq&&m.id!==window.editingMaterialId)set.add(m.id)});window._matEq=[...set];matEqPintar()}
function matEqQuitar(id){window._matEq=window._matEq.filter(x=>x!==id);matEqPintar()}
function matEqAplicar(id,eqIds,nombre){const yo=db.materiales.find(x=>x.id===id);if(!yo)return;const viejo=yo.grupoEq||'';if(viejo){const fuera=db.materiales.filter(x=>x.id!==id&&x.grupoEq===viejo&&!eqIds.includes(x.id));if(fuera.length){const ng='eq_'+generarId();fuera.forEach(x=>{x.grupoEq=ng})}}if(!eqIds.length)yo.grupoEq='';else{const g=viejo||eqIds.map(i=>db.materiales.find(x=>x.id===i)?.grupoEq).find(Boolean)||('eq_'+generarId());yo.grupoEq=g;eqIds.forEach(i=>{const x=db.materiales.find(m=>m.id===i);if(!x)return;const gx=x.grupoEq;if(gx&&gx!==g)db.materiales.forEach(m=>{if(m.grupoEq===gx)m.grupoEq=g});x.grupoEq=g})}limpiarGruposEq();if(nombre!==undefined&&yo.grupoEq){const nn=String(nombre||'').trim();db.materiales.forEach(m=>{if(m.grupoEq===yo.grupoEq)m.nombreGrupo=nn})}}
function limpiarGruposEq(){const n={};db.materiales.forEach(m=>{if(m.grupoEq)n[m.grupoEq]=(n[m.grupoEq]||0)+1});db.materiales.forEach(m=>{if(m.grupoEq&&n[m.grupoEq]<2)m.grupoEq='';if(!m.grupoEq&&m.nombreGrupo)delete m.nombreGrupo})}
function saveMaterial(){const L=(window._matProv||[]).map(x=>({proveedorId:String(x.proveedorId||''),codigo:String(x.codigo||'').trim(),precioCompra:Number(x.precioCompra)||0,url:String(x.url||'').trim()}));if(L.some(x=>!x.proveedorId)){alert('Elige el distribuidor en todas las filas de «Distribuidores» (o quita las filas vacías).');return}if(new Set(L.map(x=>x.proveedorId)).size<L.length){alert('Hay un distribuidor repetido en la lista.');return}if(L.some(x=>x.url&&!urlSegura(x.url))){alert('Un enlace a la web no es válido: tiene que empezar por http:// o https://');return}const uso=L[Math.min(window._matUso||0,L.length-1)]||null;let data={codigo:val('codigo').trim(),nombre:val('nombre').trim(),unidad:val('unidad'),categoria:val('categoria')||'',proveedorId:uso?uso.proveedorId:'',proveedores:L,precioCompra:uso?uso.precioCompra:(Number(val('precioCompra'))||0),ivaCompraPct:Number(val('ivaCompraPct'))||0,precio:Number(val('precio'))||0,stock:Number(val('stock'))||0,minStock:Number(val('minStock'))||0};if(!data.codigo||!data.nombre){alert('Código y material son obligatorios.');return}let dup=db.materiales.find(x=>String(x.codigo||'').toLowerCase()===data.codigo.toLowerCase()&&x.id!==window.editingMaterialId);if(dup){alert('Ese código ya existe.');return}let e=db.materiales.find(x=>x.id===window.editingMaterialId);let newId;if(e){let before=JSON.parse(JSON.stringify(e));Object.assign(e,data);recordModification('material',before,e);newId=e.id}else{newId=generarId();db.materiales.push({id:newId,...data})}matEqAplicar(newId,window._matEq||[],val('matEqNombre'));{const mm=db.materiales.find(x=>x.id===newId);if(mm&&Array.isArray(mm.pendientesPrecio)){mm.pendientesPrecio=mm.pendientesPrecio.filter(p=>{const row=(mm.proveedores||[]).find(r=>r.proveedorId===p.proveedorId);const actual=p.proveedorId?(row?(Number(row.precioCompra)||0):null):(Number(mm.precioCompra)||0);return actual!==null&&Math.abs(actual-(Number(p.precioCompra)||0))>=0.00005});if(!mm.pendientesPrecio.length)delete mm.pendientesPrecio}}window.editingMaterialId=null;window._matProv=null;window._matEq=null;closeModal();save()}
function editMaterial(id){let m=db.materiales.find(x=>x.id===id);if(m)modalMaterial(m)}

function gastos(){const l=db.gastos.filter(g=>enMes('gastos',g.fecha));const tot=round2(l.reduce((a,g)=>a+Number(g.importe||0)+Number(g.iva||0),0));return shell('<div class="section"><div class="cards"><div class="card"><div class="label">Total de gastos</div><div class="big negative">'+money(tot)+'</div></div><div class="card"><div class="label">Nº de gastos</div><div class="big">'+l.length+'</div></div></div></div>'+toolbarLista('gastos','Buscar gasto...')+'<div id="list">'+(l.length?'<div class="tablewrap"><table class="table"><tr><th>Fecha</th><th>Concepto</th><th>Importe total</th><th>% IVA</th><th>IVA soportado</th><th>Base sin IVA</th><th>Tomar IVA</th><th>Acciones</th></tr>'+l.slice().reverse().map(g=>'<tr><td>'+date(g.fecha)+'</td><td>'+esc(g.concepto)+'</td><td><b>'+money(Number(g.importe||0)+Number(g.iva||0))+'</b></td><td>'+esc(g.ivaPct||0)+'%</td><td>'+money(g.iva)+'</td><td>'+money(g.importe)+'</td><td>'+(g.tomaIva?'Sí':'No')+'</td><td><button class="btn small" onclick="editGasto(\''+g.id+'\')">Editar</button> <button class="btn small danger" onclick="del(\'gasto\',\''+g.id+'\')">Eliminar</button></td></tr>').join('')+'</table></div>':'<div class="empty">Sin gastos registrados.</div>')+'</div>','Gastos')}
function modalGasto(g){g=g||null;window.editingGastoId=g?.id||null;const totalIni=g?(g.total!=null?g.total:round2(Number(g.importe||0)+Number(g.iva||0))):'';modal(g?'Editar gasto':'Nuevo gasto','<div class="formgrid"><div class="field"><label>Fecha</label><input id="fecha" type="date" value="'+(g?.fecha||hoyLocal())+'"></div><div class="field"><label>Concepto</label><input id="concepto" value="'+esc(g?.concepto||'')+'"></div><div class="field"><label>Importe total (€)</label><input id="importe" type="number" step="any" value="'+totalIni+'" oninput="calcGastoIva()"></div><div class="field"><label>% IVA</label><input id="ivaPct" type="number" min="0" step="0.01" value="'+(g?.ivaPct??21)+'" oninput="calcGastoIva()"></div><div class="field"><label>IVA soportado (€)</label><input id="iva" type="number" step="any" readonly></div><div class="field"><label>Base sin IVA (€)</label><input id="baseGasto" type="number" step="any" readonly></div><div class="field"><label>Tomar IVA</label><select id="tomaIva"><option value="">— Elegir —</option><option value="si">Sí</option><option value="no">No</option></select></div></div>','saveGasto()');if(g){document.getElementById('tomaIva').value=g.tomaIva?'si':'no';document.getElementById('iva').value=Number(g.iva||0).toFixed(2);calcGastoBase()}else calcGastoIva()}
function calcGastoIva(){let total=Number(val('importe'))||0;let pct=Number(val('ivaPct'))||0;let iva=round2(total-total/(1+pct/100));let el=document.getElementById('iva');if(el)el.value=iva.toFixed(2);let b=document.getElementById('baseGasto');if(b)b.value=round2(total-iva).toFixed(2)}
function calcGastoBase(){let total=Number(val('importe'))||0;let iva=Number(val('iva'))||0;let b=document.getElementById('baseGasto');if(b)b.value=round2(total-iva).toFixed(2)}
function saveGasto(){let total=round2(Number(val('importe'))||0);if(total<=0){alert('El importe total debe ser mayor que 0.');return}let toma=val('tomaIva');if(toma!=='si'&&toma!=='no'){alert('Elige si tomas el IVA (Sí o No).');return}let iva=round2(Number(val('iva'))||0);if(iva<0||iva>total){alert('El IVA no puede ser negativo ni mayor que el importe total.');return}let data={fecha:val('fecha'),concepto:val('concepto'),total,importe:round2(total-iva),ivaPct:Number(val('ivaPct'))||0,iva,tomaIva:toma==='si'};let e=db.gastos.find(x=>x.id===window.editingGastoId);if(e){let before=JSON.parse(JSON.stringify(e));Object.assign(e,data);recordModification('gasto',before,e)}else db.gastos.push({id:generarId(),...data});window.editingGastoId=null;closeModal();save()}
function editGasto(id){let g=db.gastos.find(x=>x.id===id);if(g)modalGasto(g)}
