function modalIvaPago(trimestre){trimestre=trimestre||ivaTrimestreDeFecha(currentYM()+'-01');let trims=[...new Set([...trimestresIva(),trimestre])].sort().reverse();let opts=trims.map(t=>'<option value="'+esc(t)+'" '+(t===trimestre?'selected':'')+'>'+esc(trimestreLabel(t))+'</option>').join('');let liq=liquidacionDelTrimestre(trimestre);let pendiente=Math.max(0,(liq.resultado-liq.arrastreEntrante)-liq.pagado);modal('Registrar pago de IVA — '+trimestreLabel(trimestre),'<div class="formgrid"><div class="field"><label>Fecha del pago</label><input id="fecha" type="date" value="'+hoyLocal()+'"></div><div class="field"><label>Trimestre</label><select id="trimestre" onchange="refrescarPagoIva()">'+opts+'</select></div><div class="field"><label>IVA repercutido</label><input readonly value="'+money(liq.ventas)+'"></div><div class="field"><label>IVA soportado</label><input readonly value="'+money(liq.compras)+'"></div><div class="field"><label>Arrastre a favor</label><input readonly value="'+money(liq.arrastreEntrante)+'"></div><div class="field"><label>Saldo pendiente</label><input readonly id="iva_saldo" value="'+money(pendiente)+'"></div><div class="field"><label>Importe a pagar (€)</label><input id="importe" type="number" step="any" value="'+(pendiente>0?pendiente.toFixed(2):'')+'"></div><div class="field full"><label>Concepto</label><input id="concepto" value="Pago de IVA '+trimestreLabel(trimestre)+'"></div></div>','saveIvaPago()')}
function refrescarPagoIva(){let t=val('trimestre');let liq=liquidacionDelTrimestre(t);let pendiente=Math.max(0,(liq.resultado-liq.arrastreEntrante)-liq.pagado);let el=document.getElementById('iva_saldo');if(el)el.value=money(pendiente);let imp=document.getElementById('importe');if(imp)imp.value=pendiente>0?pendiente.toFixed(2):'';let con=document.getElementById('concepto');if(con)con.value='Pago de IVA '+trimestreLabel(t)}
function saveIvaPago(){let importe=Number(val('importe'))||0;let trimestre=val('trimestre')||ivaTrimestreDeFecha(currentYM()+'-01');if(importe<=0){alert('El importe debe ser mayor que 0.');return}let liq=liquidacionDelTrimestre(trimestre);let pendiente=Math.max(0,(liq.resultado-liq.arrastreEntrante)-liq.pagado);if(importe>pendiente+0.009){if(!confirm('El importe ('+money(importe)+') supera el saldo pendiente ('+money(pendiente)+'). ¿Continuar?'))return}db.ivaPagos.push({id:generarId(),fecha:val('fecha'),trimestre,importe,concepto:val('concepto')});closeModal();save()}

async function empezarDeCero(){
  if(!confirm('Se borrarán TODOS los presupuestos, trabajos, facturas, cobros, gastos, compras, retiros, pagos, correcciones e historial. Tus datos de empresa se conservan. Antes se descargará una copia de seguridad. ¿Continuar?'))return;
  if(!(await confirmProtectedDelete('empezarDeCero','')))return;
  const conservar=confirm('¿Conservar clientes, proveedores y materiales?\n\nAceptar = conservarlos\nCancelar = borrarlos también');
  try{descargarCopiaSeguridad()}catch(e){alert('No se pudo descargar la copia, así que no se ha borrado nada.');return}
  const lim=['presupuestos','facturas','cobros','trabajos','gastos','compras','comprasMateriales','ivaPagos','irpfPagos','ssPagos','retiros','ajustesCaja','borrados','modificados'];
  if(!conservar)lim.push('clientes','proveedores','materiales','administradores','comunidades');
  lim.forEach(k=>{db[k]=[]});
  try{if(fotosOk)await fotosVaciar()}catch(e){}
  if(!conservar){try{if(catOk)await catVaciar()}catch(e){}}
  go('dashboard');save();
  alert('Listo: la app quedó en cero. La copia anterior se descargó.');
}

function filasInforme(meses,tipo,cls){cls=cls||'';const c=cls?' class="'+cls+'"':'';const fila=(label,r,total)=>'<tr'+(total?' style="font-weight:700;background:var(--panel2)"':'')+'><td>'+label+'</td><td'+c+'>'+money(r.facturado)+'</td><td'+c+'>'+money(r.cobrado)+'</td><td'+c+'>'+money(r.costeMateriales)+'</td><td'+c+'>'+money(r.gastos)+'</td><td'+c+'>'+money(r.ivaNeto)+'</td><td'+c+'>'+money(r.irpf)+'</td><td class="'+(r.ganancia<0?'negative ':'positive ')+cls+'">'+money(r.ganancia)+'</td><td class="'+(r.caja<0?'negative ':'positive ')+cls+'">'+money(r.caja)+'</td></tr>';let rows='';meses.forEach((m,i)=>{rows+=fila(esc(monthLabel(m)),resumenMeses([m]),false);if(tipo==='anio'&&i%3===2)rows+=fila('Trimestre T'+(Math.floor(i/3)+1),resumenMeses(meses.slice(i-2,i+1)),true)});if(meses.length>1)rows+=fila('Total del período',resumenMeses(meses),true);return rows}

function resizePhoto(file,maxW,maxH,forcePng,maxBytes){maxW=maxW||900;maxH=maxH||700;return new Promise((resolve,reject)=>{if(!file)return resolve('');const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height,scale=Math.min(1,maxW/w,maxH/h);w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);const esPng=forcePng||/png/i.test(file.type||'')||/\.png$/i.test(file.name||'');let out=esPng?c.toDataURL('image/png'):c.toDataURL('image/jpeg',0.82);if(maxBytes&&out.length>maxBytes){let k=0.85,w2=w,h2=h;while(out.length>maxBytes&&w2>200){w2=Math.round(w2*k);h2=Math.round(h2*k);const c2=document.createElement('canvas');c2.width=w2;c2.height=h2;const x2=c2.getContext('2d');x2.fillStyle='#ffffff';x2.fillRect(0,0,w2,h2);x2.drawImage(img,0,0,w2,h2);out=c2.toDataURL('image/jpeg',0.8)}}resolve(out)};img.onerror=reject;img.src=reader.result};reader.onerror=reject;reader.readAsDataURL(file)})}

function pageList(type,title,vista,cols,rows,extra){let body=rows.length?'<div class="tablewrap"><table class="table"><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'<th>Acciones</th></tr>'+rows.map(r=>{let id=idSeguro(r._id||r[0].replace(/<[^>]*>/g,''));let actions='';if(type==='presupuesto')actions='<button class="btn small" onclick="viewPresupuesto(\''+id+'\')">Ver</button> <button class="btn small" onclick="printPresupuesto(\''+id+'\')">Imprimir</button> <button class="btn small" onclick="editPresupuesto(\''+id+'\')">Editar</button> ';else if(type==='factura')actions='<button class="btn small" onclick="viewFactura(\''+id+'\')">Ver</button> <button class="btn small" onclick="printFactura(\''+id+'\')">Imprimir</button> ';else if(type==='cobro')actions='<button class="btn small" onclick="viewCobro(\''+id+'\')">Ver</button> <button class="btn small" onclick="printCobro(\''+id+'\')">Imprimir</button> ';return '<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'<td>'+actions+(r._noDel?'':'<button class="btn small danger" onclick="del(\''+type+'\',\''+id+'\')">Eliminar</button>')+'</td></tr>'}).join('')+'</table></div>':'<div class="empty">No hay registros todavía.</div>';return shell(toolbarLista(vista,'Buscar...',extra)+'<div id="list">'+body+'</div>',title)}
function presupuestos(){return pageList('presupuesto','Presupuestos','presupuestos',['Nº','Cliente','Fecha','Importe total','Estado','Facturado'],db.presupuestos.filter(p=>enMes('presupuestos',p.fecha)).map(p=>[esc(p.numero),esc(clientName(p.clienteId)),date(p.fecha),money(p.total),'<span class="badge '+(p.estado==='Aceptado'?'ok':'warn')+'">'+esc(p.estado)+'</span>',presupuestoYaFacturado(p.id)?'<span class="badge ok">Sí</span>':'<span class="badge">No</span>']),'<button class="btn primary" onclick="go(\'campo\')">📋 Presupuestos en campo</button>')}
function facturas(){return pageList('factura','Facturas','facturas',['Nº','Cliente','Receptor','Fecha','Vencimiento','Importe total','Cobrado','Pendiente','Estado'],db.facturas.filter(f=>enMes('facturas',f.fecha)).map(f=>{let cob=totalCobradoFactura(f);let row=[esc(f.numero),esc(clientName(f.clienteId)),esc(receptorName(f)),date(f.fecha),date(f.fechaVencimiento),money(f.total),money(cob),money(Math.max(0,f.total-cob)),facturaEstaCobrada(f)?'<span class="badge ok">Cobrada</span>':(facturaVencida(f)?'<span class="badge" style="color:var(--danger)">Vencida</span>':'<span class="badge warn">Pendiente</span>')];if(db.cobros.some(c=>c.facturaId===f.id))row._noDel=true;return row}))}
function cobros(){let rows=db.cobros.filter(c=>enMes('cobros',c.fecha)).map(c=>{let f=db.facturas.find(x=>x.id===c.facturaId);let nombre=f?receptorName(f):clientName(c.clienteId);let r=[esc(c.numero||'—'),date(c.fecha),esc(nombre),esc(f?.numero||'—'),money(c.importe),esc(c.medio)];r._id=c.id;return r});return pageList('cobro','Cobros','cobros',['Nº','Fecha','Cliente','Factura','Importe','Medio'],rows)}
function cuentas(){let particulares=db.clientes.filter(c=>!c.comunidadId);let porCom=db.comunidades.map(com=>({com,cl:db.clientes.filter(c=>c.comunidadId===com.id)}));let html='<div class="section"><h3>Clientes particulares</h3>'+(particulares.length?'<div class="tablewrap"><table class="table"><tr><th>Cliente</th><th>Facturado</th><th>Cobrado</th><th>Saldo pendiente</th></tr>'+particulares.map(c=>{let f=db.facturas.filter(x=>x.clienteId===c.id).reduce((a,x)=>a+Number(x.total||0),0),co=db.cobros.filter(x=>x.clienteId===c.id).reduce((a,x)=>a+Number(x.importe||0),0);return '<tr><td><b>'+esc(c.nombre)+'</b></td><td>'+money(f)+'</td><td>'+money(co)+'</td><td class="'+(f-co>0?'negative':'positive')+'"><b>'+money(f-co)+'</b></td></tr>'}).join('')+'</table></div>':'<div class="empty">Sin clientes particulares.</div>')+'</div>';porCom.forEach(({com,cl})=>{if(!cl.length)return;let totF=cl.reduce((a,c)=>a+db.facturas.filter(x=>x.clienteId===c.id).reduce((b,x)=>b+Number(x.total||0),0),0);let totC=cl.reduce((a,c)=>a+db.cobros.filter(x=>x.clienteId===c.id).reduce((b,x)=>b+Number(x.importe||0),0),0);html+='<div class="section"><h3>Comunidad: '+esc(com.nombre)+'</h3><div class="tablewrap"><table class="table"><tr><th>Propietario</th><th>Facturado</th><th>Cobrado</th><th>Saldo pendiente</th></tr>'+cl.map(c=>{let f=db.facturas.filter(x=>x.clienteId===c.id).reduce((a,x)=>a+Number(x.total||0),0),co=db.cobros.filter(x=>x.clienteId===c.id).reduce((a,x)=>a+Number(x.importe||0),0);return '<tr><td>'+esc(c.nombre)+'</td><td>'+money(f)+'</td><td>'+money(co)+'</td><td class="'+(f-co>0?'negative':'positive')+'"><b>'+money(f-co)+'</b></td></tr>'}).join('')+'<tr style="background:var(--panel2)"><td><b>TOTAL COMUNIDAD</b></td><td><b>'+money(totF)+'</b></td><td><b>'+money(totC)+'</b></td><td><b>'+money(totF-totC)+'</b></td></tr></table></div></div>'});{let dir=[...db.comunidades.map(x=>({n:x.nombre+' (comunidad)',id:x.id})),...db.administradores.map(x=>({n:x.nombre+' (administración)',id:x.id}))].map(x=>{let f=db.facturas.filter(y=>y.clienteId===x.id).reduce((a,y)=>a+Number(y.total||0),0),co=db.cobros.filter(y=>y.clienteId===x.id).reduce((a,y)=>a+Number(y.importe||0),0);return {n:x.n,f,co}}).filter(x=>x.f||x.co);if(dir.length)html+='<div class="section"><h3>Comunidades y administraciones (facturación directa)</h3><div class="tablewrap"><table class="table"><tr><th>Cuenta</th><th>Facturado</th><th>Cobrado</th><th>Saldo pendiente</th></tr>'+dir.map(x=>'<tr><td><b>'+esc(x.n)+'</b></td><td>'+money(x.f)+'</td><td>'+money(x.co)+'</td><td class="'+(x.f-x.co>0?'negative':'positive')+'"><b>'+money(x.f-x.co)+'</b></td></tr>').join('')+'</table></div></div>'}return shell(html,'Cuentas corrientes','Estado de cada cliente y por comunidad')}

/* ==== COMPRAS ==== */
function compras(){const l=db.compras.filter(c=>enMes('compras',c.fecha));const tot=round2(l.reduce((a,c)=>a+Number(c.total||0),0));const ivaT=round2(l.reduce((a,c)=>a+Number(c.iva||0),0));const baseT=round2(l.reduce((a,c)=>a+Number(c.base||0),0));return shell('<div class="section"><div class="cards"><div class="card"><div class="label">Compras registradas</div><div class="big">'+money(tot)+'</div></div><div class="card"><div class="label">IVA soportado</div><div class="big positive">'+money(ivaT)+'</div></div><div class="card"><div class="label">Base sin IVA</div><div class="big">'+money(baseT)+'</div></div></div></div>'+toolbarLista('compras','Buscar compra...','<button class="btn primary" onclick="icIniciar()">📄 Subir materiales desde factura, en PDF</button>')+'<div id="list">'+(l.length?'<div class="tablewrap"><table class="table"><tr><th>Nº</th><th>Fecha</th><th>Concepto</th><th>Proveedor</th><th>Base sin IVA</th><th>IVA soportado</th><th>Importe total</th><th>Acciones</th></tr>'+l.slice().reverse().map(c=>'<tr><td>'+esc(c.numero||'—')+'</td><td>'+date(c.fecha)+'</td><td>'+esc(c.concepto||'—')+(c.facturaProveedor?'<br><span class="smallnote">Factura '+esc(c.facturaProveedor)+'</span>':'')+'</td><td>'+esc(proveedorName(c.proveedorId))+'</td><td>'+money(c.base)+'</td><td>'+money(c.iva)+'</td><td><b>'+money(c.total)+'</b></td><td><button class="btn small" onclick="editCompra(\''+c.id+'\')">Editar</button> <button class="btn small danger" onclick="del(\'compra\',\''+c.id+'\')">Eliminar</button></td></tr>').join('')+'</table></div>':'<div class="empty">Sin compras registradas.</div>')+'</div>','Compras')}
function modalCompra(c,materialId){c=c||null;window.editingCompraId=c?.id||null;let m=materialId?db.materiales.find(x=>x.id===materialId):null;let preselected=c?.materialId||materialId||'';let pctDefault=c?.ivaPct??m?.ivaCompraPct??21;let cantIni=c?.cantidad??1;let precioUnitIni=c?.precioUnitario??(c&&c.cantidad?+(Number(c.base||0)/Number(c.cantidad||1)).toFixed(4):(m?.precioCompra??0));let baseIni=c?.base??(precioUnitIni*cantIni);let modoIni=c?.modoBase||'auto';modal(c?'Editar compra':'Nueva compra',(c?'':'<div class="card" style="margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><span class="smallnote" style="flex:1;min-width:200px">¿Tienes la factura del distribuidor en PDF? La app lee las líneas y las carga sola.</span><button type="button" class="btn primary" onclick="closeModal();icIniciar()">📄 Subir materiales desde factura, en PDF</button></div>')+'<div class="formgrid"><div class="field"><label>Fecha</label><input id="fecha" type="date" value="'+(c?.fecha||hoyLocal())+'"></div><div class="field"><label>Proveedor / distribuidor</label><select id="proveedorId"><option value="">—</option>'+db.proveedores.map(v=>'<option value="'+esc(v.id)+'" '+(v.id===c?.proveedorId?'selected':'')+'>'+esc(v.nombre)+'</option>').join('')+'</select></div><div class="field full"><label>Concepto</label><input id="concepto" value="'+esc(c?.concepto||(m?m.nombre:''))+'"></div><div class="field full"><label>Material</label><select id="materialId" onchange="syncPrecioDesdeMaterial()"><option value="">➕ Material nuevo (se crea con los datos de esta compra)</option>'+db.materiales.map(mm=>'<option value="'+esc(mm.id)+'" '+(mm.id===preselected?'selected':'')+'>'+esc(mm.codigo)+' — '+esc(mm.nombre)+'</option>').join('')+'</select><div class="smallnote" style="margin-top:4px">La cantidad comprada se suma siempre al stock del material.</div></div><div id="compraNuevoMat" class="field full" style="display:none"><div class="formgrid"><div class="field"><label>Código del material nuevo</label><input id="nmCodigo"></div><div class="field"><label>Unidad</label><input id="nmUnidad" value="ud"></div><div class="field"><label>Precio de venta sin IVA (€)</label><input id="nmPrecio" type="number" step="any" value="0"></div></div><div class="smallnote">El nombre del material será el concepto. El precio de compra y el % IVA salen de esta compra.</div></div><div class="field"><label>Cantidad</label><input id="cantidad" type="number" step="any" value="'+cantIni+'" oninput="calcCompra()"></div><div class="field"><label>Precio unitario sin IVA (€)</label><input id="precioUnitario" type="number" step="any" value="'+precioUnitIni+'" oninput="calcCompra()"></div><div class="field"><label>% IVA</label><input id="ivaPct" type="number" step="0.01" value="'+pctDefault+'" oninput="calcCompra()"></div><div class="field"><label>Cálculo de base</label><select id="modoBase" onchange="cambiarModoBase()"><option value="auto" '+(modoIni==='auto'?'selected':'')+'>Automático</option><option value="manual" '+(modoIni==='manual'?'selected':'')+'>Manual</option></select></div><div class="field full"><label>Base sin IVA (€)</label><input id="base" type="number" step="any" value="'+baseIni+'" oninput="calcCompraDesdeBase()"></div><div class="field"><label>IVA soportado (€)</label><input id="iva" type="number" step="any" readonly></div><div class="field"><label>Importe total (€)</label><input id="total" type="number" step="any" readonly></div></div>','saveCompra()');compraNuevoMatVer();cambiarModoBase();if(modoIni==='auto'){calcCompra()}else{recalcCompraIva()}}
function cambiarModoBase(){let modo=val('modoBase')||'auto';let base=document.getElementById('base'),pu=document.getElementById('precioUnitario');if(base)base.readOnly=modo==='auto';if(pu)pu.readOnly=modo==='manual'}
function compraNuevoMatVer(){const b=document.getElementById('compraNuevoMat');if(b)b.style.display=val('materialId')?'none':'block'}
function syncPrecioDesdeMaterial(){compraNuevoMatVer();let id=val('materialId');if(!id)return;let m=db.materiales.find(x=>x.id===id);if(!m)return;let el=document.getElementById('precioUnitario');if(el)el.value=Number(m.precioCompra||0).toFixed(2);let e2=document.getElementById('ivaPct');if(e2&&m.ivaCompraPct!=null)e2.value=Number(m.ivaCompraPct).toFixed(2);let modo=val('modoBase')||'auto';if(modo==='auto')calcCompra();else recalcCompraIva()}
function calcCompra(){let modo=val('modoBase')||'auto';let cant=Number(val('cantidad'))||0;let pu=Number(val('precioUnitario'))||0;let baseEl=document.getElementById('base');if(modo==='manual'){let base=Number(val('base'))||0;if(cant>0){let p=document.getElementById('precioUnitario');if(p)p.value=(base/cant).toFixed(4)}}else{let base=cant*pu;if(baseEl)baseEl.value=base.toFixed(2)}recalcCompraIva()}
function calcCompraDesdeBase(){let modo=val('modoBase')||'auto';if(modo!=='manual'){recalcCompraIva();return}let base=Number(val('base'))||0;let cant=Number(val('cantidad'))||0;if(cant>0){let pu=base/cant;let el=document.getElementById('precioUnitario');if(el)el.value=pu.toFixed(4)}recalcCompraIva()}
function recalcCompraIva(){let base=Number(val('base'))||0;let pct=Number(val('ivaPct'))||0;let iva=base*pct/100;let i=document.getElementById('iva'),t=document.getElementById('total');if(i)i.value=iva.toFixed(2);if(t)t.value=(base+iva).toFixed(2)}
function saveCompra(){let data={fecha:val('fecha'),proveedorId:val('proveedorId'),concepto:val('concepto'),materialId:val('materialId'),cantidad:Number(val('cantidad'))||0,sumarStock:true,precioUnitario:Number(val('precioUnitario'))||0,base:Number(val('base'))||0,modoBase:val('modoBase')||'auto',ivaPct:Number(val('ivaPct'))||0,iva:Number(val('iva'))||0,total:Number(val('total'))||0};data.base=round2(data.base);data.iva=round2(data.iva);data.total=round2(data.total);if(!data.concepto.trim()&&data.materialId){data.concepto=db.materiales.find(x=>x.id===data.materialId)?.nombre||''}if(!data.concepto.trim()){alert(data.materialId?'Pon un concepto.':'Pon un concepto: será el nombre del material nuevo.');return}if(!(data.cantidad>0)){alert('La cantidad debe ser mayor que 0.');return}if(!(data.base>0)){alert('El importe de la compra debe ser mayor que 0.');return}let nuevo=null;if(!data.materialId){const cod=String(val('nmCodigo')||'').trim();if(!cod){alert('Elige el material de la lista o, si es nuevo, ponle un código.');return}if(db.materiales.some(x=>String(x.codigo||'').toLowerCase()===cod.toLowerCase())){alert('Ya existe un material con el código '+cod+'. Elígelo en la lista «Material».');return}const pv=Number(val('nmPrecio'))||0;const pu=data.cantidad>0?round2(data.base/data.cantidad*10000)/10000:data.precioUnitario;nuevo={id:generarId(),codigo:cod,nombre:data.concepto.trim(),unidad:String(val('nmUnidad')||'').trim()||'ud',proveedorId:data.proveedorId||'',proveedores:data.proveedorId?[{proveedorId:data.proveedorId,codigo:'',precioCompra:pu,url:''}]:[],precioCompra:pu,ivaCompraPct:data.ivaPct,precio:pv,stock:0,minStock:0};if(!confirm('No elegiste un material de la lista, así que se va a crear uno nuevo:\n\n• '+nuevo.codigo+' — '+nuevo.nombre+'\n• Precio de compra: '+money(pu)+' sin IVA\n• Precio de venta: '+(pv>0?money(pv)+' sin IVA':'sin poner (ponlo luego en Materiales)')+'\n• Stock: +'+data.cantidad+' '+nuevo.unidad+'\n\n¿Continuar?'))return;db.materiales.push(nuevo);data.materialId=nuevo.id}let e=db.compras.find(x=>x.id===window.editingCompraId);let oldSumar=e?.sumarStock,oldMat=e?.materialId,oldCant=Number(e?.cantidad||0);if(e){let before=JSON.parse(JSON.stringify(e));Object.assign(e,data);recordModification('compra',before,e)}else db.compras.push({id:generarId(),numero:nextCompraNum(),...data});if(oldSumar&&oldMat){let m=db.materiales.find(x=>x.id===oldMat);if(m)m.stock=round2(Number(m.stock||0)-oldCant)}if(data.materialId){let m=db.materiales.find(x=>x.id===data.materialId);if(m)m.stock=round2(Number(m.stock||0)+Number(data.cantidad||0))}window.editingCompraId=null;closeModal();save();if(!e&&!nuevo)revisarPrecioCompra(data)}
function editCompra(id){let c=db.compras.find(x=>x.id===id);if(c)modalCompra(c)}
