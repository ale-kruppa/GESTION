.celda{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:46px;border-top:.5px solid var(--linea);position:relative}.grupo>.celda:first-child{border-top:0}
.celda .t{flex:1;min-width:0}.celda .t small{display:block;color:var(--sec);font-size:13px;margin-top:1px}
.celda .v{color:var(--sec);text-align:right}.celda.tap{cursor:pointer}.celda.tap:active{background:var(--relleno)}

.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:16px;flex:0 0 30px}

.buscar{display:flex;align-items:center;gap:8px;background:var(--relleno);border-radius:11px;padding:9px 12px}.buscar input{flex:1;border:0;background:transparent;outline:none;font-size:17px}
.seg{display:flex;background:var(--relleno);border-radius:9px;padding:2px;gap:2px;flex-wrap:nowrap;overflow-x:auto;max-width:100%}.seg button{flex:1;border:0;background:none;padding:6px 8px;font-size:14px;font-weight:500;border-radius:7px;cursor:pointer;white-space:nowrap}.seg button.on{background:var(--grupo);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}

.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--relleno);position:relative;flex:0 0 51px;cursor:pointer;transition:background .2s;margin:0}.sw:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .2s}.sw:checked{background:var(--verde)}.sw:checked:after{left:22px}

.tot{display:flex;justify-content:space-between;padding:3px 0;color:var(--sec)}.tot b{color:var(--txt);font-weight:600}.tot.g{color:var(--txt);font-size:22px;font-weight:700;padding-top:8px}.tot.s{color:var(--txt);font-weight:600}
.pie{position:sticky;bottom:0;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);background:light-dark(rgba(242,242,247,.94),rgba(0,0,0,.92));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:.5px solid var(--linea)}.pie .boton{margin-top:6px}
.puntos{display:flex;gap:5px;justify-content:center;padding:0 16px 6px}.puntos i{height:4px;flex:1;max-width:44px;border-radius:2px;background:var(--linea)}.puntos i.on{background:var(--azul)}
.fotos{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px}.foto{position:relative}.foto img{width:84px;height:84px;object-fit:cover;border-radius:12px;display:block}.foto button{position:absolute;top:-7px;right:-7px;border:0;border-radius:50%;width:26px;height:26px;background:var(--rojo);color:#fff;font-size:14px;cursor:pointer}.foto.mas{width:84px;height:84px;border-radius:12px;background:var(--relleno);display:grid;place-items:center;color:var(--azul);font-size:30px;cursor:pointer}
.hoja{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}.hoja>div{background:var(--fondo);width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:0 0 calc(env(safe-area-inset-bottom) + 16px)}.hoja .nav{position:sticky;border-radius:14px 14px 0 0}
.estado{font-size:13px;color:var(--sec);text-align:center;margin:16px 0 4px}
.pv-grow{flex:1}.pv-tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--aviso);color:var(--avisotxt);font-weight:600}.pv-tag.ok{background:var(--okfondo);color:var(--oktxt)}
.vacio{color:var(--sec);text-align:center;padding:18px}
@media (min-width:700px){.cuerpo{padding:4px 22px 28px}}
.pv-sel{padding:10px 16px;border-top:.5px solid var(--linea)}.pv-sel-t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:15px}.pv-opt{display:flex;gap:8px;align-items:center;padding:9px 11px;border-radius:10px;background:var(--relleno);cursor:pointer;font-size:15px;margin-top:4px}.pv-opt.on{background:light-dark(#e5f0ff,#10294d);cursor:default}.pv-opt.pv-roja{outline:1px solid var(--rojo)}.pv-drop{margin-top:6px}.pv-falta{color:var(--rojo);font-weight:600}.pv-sel input.search{width:100%;border:0;background:var(--relleno);border-radius:10px;padding:9px 12px;font-size:16px;outline:none;margin-top:8px}.pv-todos{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--sec);margin-top:8px}.pv-sel .btn.small{border:0;background:none;color:var(--azul);padding:4px 0;font-size:15px;cursor:pointer}.smallnote{font-size:13px;color:var(--sec)}</style></head><body><div id="app"></div>
<script>
/* ===== APP DE PRESUPUESTOS (apoyo en obra y oficina) — núcleo ===== */
const APP_PRES_VER=2;
const LS_CFG='presCampo_cfg',LS_BASE='presCampo_base',LS_DATOS='presCampo_datos';
function leerLS(k,def){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?def:v}catch(e){return def}}
function escribirLS(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('⚠ No se pudo guardar en este aparato: '+(e&&e.message||e));return false}}
let cfg=leerLS(LS_CFG,{}),base=leerLS(LS_BASE,null),datos=leerLS(LS_DATOS,{pres:[],hashes:{},seq:0});
function guardarCfg(){escribirLS(LS_CFG,cfg)}
function guardarDatos(){escribirLS(LS_DATOS,datos);programarSync()}
/* utilidades */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',useGrouping:'always'}).format(Number(n)||0);
function round2(n){n=Number(n||0);if(!isFinite(n))return 0;return Math.round((n+Number.EPSILON*Math.sign(n))*100)/100}
function num(v){const n=Number(String(v??'').replace(',','.'));return isFinite(n)?n:0}
function sinAcentos(t){return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function generarId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():('id_'+Date.now()+'_'+Math.random().toString(36).slice(2))}
function hoyLocal(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fechaTxt(d){if(!d)return '';const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d);const o=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(d);return isNaN(o)?'':o.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}
function hashTxt(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function conTiempo(p,ms,msg){let t;return Promise.race([p,new Promise((_,rej)=>{t=setTimeout(()=>rej(new Error(msg)),ms)})]).finally(()=>clearTimeout(t))}
const LIBS_V=1,LIBS_IDS=['lib_jspdf','lib_html2canvas'],_libs={};
function libUrl(id){return 'libs/'+id+'.txt?v='+LIBS_V}
function libTexto(id){if(_libs[id]!=null)return _libs[id];const el=document.getElementById(id);if(!el)throw new Error('Falta una librería interna ('+id+').');return el.textContent}
/* el creador de PDF va en archivos aparte: se baja solo cuando hace falta y queda guardado en el aparato */
async function libPreparar(ids){for(const id of ids){if(_libs[id]!=null||document.getElementById(id))continue;let r;try{r=await fetch(libUrl(id))}catch(e){throw new Error('Hace falta internet la primera vez que se crea un PDF en este aparato.')}if(!r.ok)throw new Error('No se pudo descargar una parte de la app ('+id+', error '+r.status+').');_libs[id]=await r.text()}}
function libsGuardarEnAparato(){if(document.getElementById(LIBS_IDS[0])||!/^https?:$/.test(location.protocol)||!('caches' in window)||!('serviceWorker' in navigator))return;setTimeout(async()=>{try{await navigator.serviceWorker.ready;for(const id of LIBS_IDS){if(navigator.onLine===false)return;const u=libUrl(id);if(!(await caches.match(u)))await fetch(u).then(r=>r.blob())}}catch(e){}},3000)}
/* base leída de gestión (solo lectura) */
const B=()=>base||{clientes:[],comunidades:[],administradores:[],materiales:[],empresa:{}};
const db={get materiales(){return B().materiales||[]}};
function ivaDefecto(){const v=B().empresa&&B().empresa.iva;return v!==undefined&&v!==''&&isFinite(Number(v))?Number(v):21}
function receptores(){const b=B();return [...(b.clientes||[]).map(c=>({...c,_tipo:'cliente',_sub:[c.dir,c.localidad].filter(Boolean).join(', ')})),...(b.comunidades||[]).map(c=>{const a=(b.administradores||[]).find(x=>x.id===c.administradorId);return {...c,_tipo:'comunidad',_sub:'Finca'+(a?' · '+a.nombre:'')}}),...(b.administradores||[]).map(a=>({...a,_tipo:'administrador',_sub:'Administración'}))]}
function receptor(id){return id?receptores().find(x=>x.id===id)||null:null}
/* fotos en el aparato (IndexedDB) */
let _idb=null;const fotosMem={};
function idb(){return _idb||(_idb=new Promise((ok,ko)=>{const r=indexedDB.open('presCampoFotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}))}
async function fotoPut(id,url){fotosMem[id]=url;const d=await idb();await new Promise((ok,ko)=>{const tx=d.transaction('f','readwrite');tx.objectStore('f').put(url,id);tx.oncomplete=ok;tx.onerror=()=>ko(tx.error)})}
async function fotoGet(id){if(fotosMem[id])return fotosMem[id];try{const d=await idb();const v=await new Promise((ok,ko)=>{const r=d.transaction('f').objectStore('f').get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});if(v)fotosMem[id]=v;return v||''}catch(e){return ''}}
async function fotoDel(id){delete fotosMem[id];try{const d=await idb();d.transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}}
function reducirFoto(file,maxW,maxH){return new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,maxW/im.width,maxH/im.height);const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.82))};im.onerror=()=>ko(new Error('No se pudo leer la foto'));im.src=fr.result};fr.onerror=()=>ko(fr.error);fr.readAsDataURL(file)})}
/* ===== conexión con Google (clave limitada de presupuestos) ===== */
const sync={enCurso:false,pend:false,timer:null,ultimoOk:0,tipo:'',txt:''};
async function llamar(cuerpo,c){c=c||cfg;let r;try{r=await conTiempo(fetch(c.url,{method:'POST',body:JSON.stringify(Object.assign({},cuerpo,{clave:c.clave})),redirect:'follow'}),120000,'Google no contesta')}catch(e){throw new Error(e&&e.message==='Google no contesta'?e.message:'no se pudo conectar con Google (¿hay internet?)')}
  if(!r.ok)throw new Error('Google respondió con un error ('+r.status+')');let j;try{j=await r.json()}catch(e){throw new Error('respuesta no esperada: revisa la dirección')}if(!j.ok)throw new Error(j.error||'error del servidor');return j}
function estadoSync(tipo,txt){sync.tipo=tipo;sync.txt=txt;const el=document.getElementById('estadoSync');if(el)el.textContent=estadoSyncTxt()}
function estadoSyncTxt(){if(!cfg.url)return '';return ({ok:'☁ ',sync:'☁ ',sin:'☁ ✗ ',error:'☁ ⚠ '}[sync.tipo]||'☁ ')+(sync.txt||'')}
function programarSync(ms){if(!cfg.url)return;clearTimeout(sync.timer);sync.timer=setTimeout(()=>sincronizar(false),ms||3000)}
async function sincronizar(manual,conBase){
  if(!cfg.url)return;if(sync.enCurso){sync.pend=true;return}
  if(navigator.onLine===false){estadoSync('sin','sin internet: se sincroniza al volver');return}
  sync.enCurso=true;
  try{const H=datos.hashes||(datos.hashes={}),ahora=Date.now(),cambios=[],mios={};
    for(const p of datos.pres){for(const id of (p.fotos||[])){const k='foto/'+id;if(!H[k]){const c=await fotoGet(id);if(c){estadoSync('sync','subiendo fotos…');await llamar({accion:'subir',tipo:'foto',id,contenido:c});cambios.push({k,m:ahora,d:{t:1}});mios[k]='1'}}}
      const k='campo/'+p.id,h=hashTxt(JSON.stringify(p));if(H[k]!==h){cambios.push({k,m:ahora,d:p});mios[k]=h}}
    for(const k in H){if(k.startsWith('campo/')&&!datos.pres.some(p=>'campo/'+p.id===k)){cambios.push({k,m:ahora,d:null});mios[k]=null}}
    const tocaBase=conBase||manual||!base||Date.now()-(cfg.baseAt||0)>30*60000;
    if(!manual&&!tocaBase&&!cambios.length&&Date.now()-sync.ultimoOk<60000)return;
    estadoSync('sync','sincronizando…');
    const r=await llamar({accion:'sync',desde:datos.seq||0,cambios});let cambio=false;
    for(const rec of (r.recs||[])){const k=rec.k;if(k in mios&&Number(rec.m)===ahora){if(mios[k]===null)delete H[k];else H[k]=mios[k];continue}
      if(k.startsWith('foto/')){H[k]='1';continue}
      if(k.startsWith('campo/')){const id=k.slice(6),i=datos.pres.findIndex(p=>p.id===id);if(rec.d===null){if(i>=0)datos.pres.splice(i,1);delete H[k]}else{if(i>=0)datos.pres[i]=rec.d;else datos.pres.push(rec.d);H[k]=hashTxt(JSON.stringify(rec.d))}cambio=true}}
    datos.seq=r.seq;escribirLS(LS_DATOS,datos);
    if(tocaBase){const b=await llamar({accion:'base'});base=b.base;escribirLS(LS_BASE,base);cfg.baseAt=Date.now();guardarCfg();cambio=true}
    sync.ultimoOk=Date.now();estadoSync('ok','sincronizado '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
    if(cambio&&!document.querySelector('.hoja')&&(V.vista==='inicio'||V.vista==='ajustes'))pintar();
  }catch(e){estadoSync(navigator.onLine===false?'sin':'error',navigator.onLine===false?'sin internet':'no se pudo sincronizar');if(manual)alert('No se pudo sincronizar: '+(e&&e.message||e))}
  finally{sync.enCurso=false;if(sync.pend){sync.pend=false;programarSync(1500)}}}
function iniciarSync(){setInterval(()=>sincronizar(false),180000);addEventListener('online',()=>programarSync(800));document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')programarSync(800)});if(cfg.url)sincronizar(false,true)}
async function conectar(){const url=String(document.getElementById('cUrl').value||'').trim(),clave=String(document.getElementById('cClave').value||'').trim();
  if(!/^https:\/\/\S+$/.test(url)){alert('Pega la dirección de la «Aplicación web» de tu Apps Script (empieza por https://script.google.com/…).');return}
  if(!clave){alert('Pega la clave de la app de presupuestos (la que empieza por P).');return}
  const c={url,clave};const btn=document.getElementById('cBtn');if(btn){btn.disabled=true;btn.textContent='Conectando…'}
  try{const r=await llamar({accion:'ping'},c);if(r.rol!=='campo'){alert(r.rol==='gestion'?'Esa es la clave de GESTIÓN. Aquí va la clave de la app de presupuestos (empieza por P): está en el registro de «instalar» o con la función «verClave».':'Esta dirección no es la del Apps Script actualizado. Pega el código nuevo y vuelve a ejecutar «instalar».');return}
    const b=await llamar({accion:'base'},c);cfg={url,clave,baseAt:Date.now()};guardarCfg();base=b.base;escribirLS(LS_BASE,base);
    V.vista='inicio';pintar();sincronizar(false)}
  catch(e){alert('No se pudo conectar: '+(e&&e.message||e))}finally{if(btn){btn.disabled=false;btn.textContent='Conectar'}}}
function desconectar(){if(!confirm('¿Desconectar este aparato de Google? Los presupuestos guardados aquí se quedan.'))return;cfg={};guardarCfg();V.vista='conectar';pintar()}

/* ===== PLANTILLAS: cada una en su bloque (se pueden añadir o cambiar sin tocar lo demás) ===== */
const ORDEN=['solar','cargador','cuadro','contadores','libre'];
/* buscar material de tu lista que encaje con lo pedido (todas las condiciones), el más barato; «pref» desempata */
function texMat(m){return sinAcentos([m.nombre,m.categoria,m.codigo,(m.cods||[]).join(' ')].join(' '))}
function buscarAuto(req,pref){const L=db.materiales.filter(m=>{const t=texMat(m);return req.every(r=>r.test(t))});if(!L.length)return null;const pf=m=>(pref||[]).filter(r=>r.test(texMat(m))).length;L.sort((a,b)=>pf(b)-pf(a)||(num(a.precio)-num(b.precio)));return L[0]}
const reNum=n=>new RegExp('(^|[^\\d.,])'+String(n).replace(/[.,]/,'[.,]')+'(?![\\d])');
const reAmp=a=>new RegExp('(^|[^\\d])'+a+'\\s?a\\b');

/* ---------- materiales y totales de un trabajo ---------- */
function lineasT(tipo,t){return TPL[tipo].lineas(t).map(l=>{let m=null,mano=null;const e=t.elegidos[l.clave];
  if(l.fijo)m=l.fijo;else if(e&&e.mano)mano=e;else if(e&&e.id)m=db.materiales.find(x=>x.id===e.id)||null;else if(l.req&&!l.falta)m=buscarAuto(l.req,l.pref);
  const precio=mano?num(mano.precio):m?num(m.precio):0;return {...l,m,mano,precio,nombre:mano?mano.nombre:m?m.nombre:l.txt,pendiente:!m&&!mano,revisar:!!(mano||l.revisar)}})}
function totalesT(tipo,t){const L=lineasT(tipo,t);let mat=round2(L.reduce((a,x)=>a+x.q*x.precio,0)+t.extra.reduce((a,x)=>a+num(x.cantidad)*num(x.precio),0));
  let mo=TPL[tipo].manoObra?TPL[tipo].manoObra(t):num(t.mo);const calc=round2(mat+mo);let sub=calc;
  if(TPL[tipo].libre&&String(t.totalManual).trim()!==''){sub=round2(num(t.totalManual));mo=round2(mo+(sub-calc))}
  return {L,mat,mo:round2(mo),sub,calc,pend:L.filter(x=>x.pendiente).length,rev:L.filter(x=>x.revisar).length+t.extra.filter(x=>x.revisar).length}}
function totalesP(p){const tr=ORDEN.filter(k=>p.trabajos[k]&&p.trabajos[k].on).map(k=>({tipo:k,...totalesT(k,p.trabajos[k])}));const base=round2(tr.reduce((a,x)=>a+x.sub,0));const pct=num(p.iva);const iva=round2(base*pct/100);return {tr,base,pct,iva,total:round2(base+iva),pend:tr.reduce((a,x)=>a+x.pend,0),rev:tr.reduce((a,x)=>a+x.rev,0)}}

};
function pvCatOk(m,c){if(c==='*')return true;if(c.endsWith('*'))return String(m.categoria||'').startsWith(c.slice(0,-1));return (m.categoria||'')===c}
function pvCatTxt(c){return c.endsWith('*')&&c!=='*'?c.slice(0,-1)+' (trifásico y monofásico)':c}
function pvOpciones(id){const s=pvS(),c=PV_SEL[id].cat(s);return db.materiales.filter(m=>s.todos[id]||pvCatOk(m,c)).sort((a,b)=>(Number(a.precio)||0)-(Number(b.precio)||0))}
function pvMasBarato(cat){return db.materiales.filter(m=>(m.categoria||'')===cat).sort((a,b)=>(Number(a.precio)||0)-(Number(b.precio)||0))[0]||null}
function pvVisible(id){const d=PV_SEL[id];return d.vis?d.vis(pvS()):true}
function pvReq(id){const d=PV_SEL[id];return pvVisible(id)&&!!(d.req&&d.req(pvS()))}
function pvElegido(id){const s=pvS(),v=s.sel[id];if(!v||v==='no'||!pvVisible(id))return null;return db.materiales.find(m=>m.id===v)||null}
function pvValidar(){const s=pvS();Object.keys(PV_SEL).forEach(id=>{const v=s.sel[id];if(!v)return;if(v==='no'){if(!PV_SEL[id].noLleva)delete s.sel[id];return}if(!pvOpciones(id).some(m=>m.id===v))delete s.sel[id]})}
function pvSelHtml(id){
  const s=pvS(),d=PV_SEL[id];if(!pvVisible(id))return '';
  const cat=d.cat(s),propias=cat==='*'?[]:db.materiales.filter(m=>pvCatOk(m,cat)).sort((a,b)=>(Number(a.precio)||0)-(Number(b.precio)||0));
  const min=propias.length?Number(propias[0].precio)||0:null;const barato=m=>min!=null&&pvCatOk(m,cat)&&(Number(m.precio)||0)===min;
  const x=pvElegido(id),v=s.sel[id],q=String(s.q[id]||'').trim().toLowerCase(),falta=pvReq(id)&&!v;
  let actual;
  if(v==='no')actual=`<span class="pv-grow"><b>No lleva</b></span>`;
  else if(x)actual=`<span class="pv-grow"><b>${esc(x.codigo||'')} — ${esc(x.nombre)}</b>${barato(x)?' <span class="pv-tag ok">más barato</span>':''}</span><b>${money(x.precio)}</b>`;
  else actual=falta?`<span class="pv-grow pv-falta">⚠️ Sin elegir: búscalo abajo</span>`:`<span class="pv-grow smallnote">Ningún material elegido</span>`;
  let h=`<div class="pv-sel"><div class="pv-sel-t"><b>${esc(d.t)}</b>${cat!=='*'?`<span class="smallnote">Categoría: ${esc(pvCatTxt(cat))}</span>`:''}</div><div class="pv-opt on${falta?' pv-roja':''}">${actual}</div>`;
  if(d.noLleva)h+=`<div style="margin-top:6px"><button type="button" class="btn small" onclick="pvElegir('${id}','${v==='no'?'':'no'}')">${v==='no'?'Sí lleva':'No lleva'}</button></div>`;

function matTHtml(tipo,t){const T=totalesT(tipo,t);let h='<div class="grupo">';
  if(TPL[tipo].solar)h+='';
  else if(!T.L.length&&!t.extra.length)h+=TPL[tipo].libre?'':'<div class="vacio">Contesta las preguntas de arriba y aquí salen los materiales.</div>';
  T.L.forEach(x=>{h+='<div class="celda'+(x.falta?'':' tap')+'"'+(x.falta||x.fijo?'':' onclick="hojaElegir(\''+x.clave+'\')"')+'><div class="t">'+(x.pendiente?'<span class="'+(x.falta?'rojo':'azul')+'">'+esc(x.txt)+'</span><small>'+(x.falta?esc(x.falta):'Toca para elegir el material de tu lista o ponerlo a mano')+'</small>':esc(x.nombre)+'<small>'+(+x.q.toFixed(3))+' '+esc(x.unidad||x.m?.unidad||'ud')+' × '+money(x.precio)+' = '+money(x.q*x.precio)+(x.revisar?' · <span style="color:var(--avisotxt)">revisar en oficina</span>':'')+'</small>')+'</div>'+(x.fijo||x.falta?'':'<span class="v">›</span>')+'</div>'});
  t.extra.forEach((x,j)=>{h+='<div class="celda"><div class="t">'+esc(x.nombre)+'<small>'+money(x.precio)+(x.revisar?' (referencia) · <span style="color:var(--avisotxt)">revisar en oficina</span>':'')+'</small></div><div class="step"><button type="button" onclick="extraCant('+j+',-1)">−</button><input inputmode="decimal" value="'+esc(x.cantidad)+'" onchange="extraCant('+j+',this.value,true)"><button type="button" onclick="extraCant('+j+',1)">+</button></div></div>'});
  h+='<div class="celda tap" onclick="hojaBuscarMat()"><div class="t azul">🔍 Añadir de mis materiales</div></div><div class="celda tap" onclick="hojaMano()"><div class="t azul">✎ Añadir a mano (con búsqueda de precio)</div></div></div>';
  if(T.pend)h+='<div class="aviso">'+T.pend+' material'+(T.pend>1?'es':'')+' sin elegir: no suman hasta que lo elijas.</div>';return h}
function subTHtml(tipo,t){const T=totalesT(tipo,t);let h='<div class="grupo" style="margin-top:18px;padding:10px 16px"><div class="tot"><span>Materiales</span><b>'+money(T.mat)+'</b></div><div class="tot"><span>Mano de obra</span><b>'+money(T.mo)+'</b></div><div class="tot s"><span>Subtotal '+esc(TPL[tipo].corto.toLowerCase())+'</span><span>'+money(T.sub)+'</span></div></div>';
  if(TPL[tipo].libre)h+='<div class="etq">Total de este trabajo</div><div class="grupo"><div class="celda"><div class="t">Calculado<small>materiales + mano de obra</small></div><span class="v">'+money(T.calc)+'</span></div><div class="celda"><div class="t">Total que quieres poner<small>opcional: la diferencia va a la mano de obra</small></div><input class="campo num" inputmode="decimal" placeholder="—" value="'+esc(t.totalManual)+'" onchange="tAct().totalManual=this.value;refrescarTrabajo();tocar()"></div></div>';return h}
function refrescarTrabajo(){const L=pasos(V.p),tipo=L[V.paso],t=V.p.trabajos[tipo];if(!t)return;const a=document.getElementById('matT');if(a)a.innerHTML=matTHtml(tipo,t);const b=document.getElementById('subT');if(b){const act=document.activeElement;if(!(act&&b.contains(act)))b.innerHTML=subTHtml(tipo,t)}}
function extraCant(j,d,abs){const t=tAct(),x=t.extra[j];const n=abs?num(d):round2(num(x.cantidad)+d);if(!(n>0))t.extra.splice(j,1);else x.cantidad=round2(n);refrescarTrabajo();tocar()}

  return '<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;font:13px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;color:#1d1d1f;background:#fff}.h{padding:46px 48px}.cab{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.emp{font-size:12px;color:#6e6e73}.emp b{display:block;font-size:16px;color:#1d1d1f;margin-bottom:2px}.logo{max-width:170px;max-height:70px;object-fit:contain;display:block;margin-bottom:8px}h1{margin:0;font-size:24px;letter-spacing:.03em;text-align:right}.meta{text-align:right;color:#6e6e73;font-size:12px;margin-top:6px}.caja{margin-top:26px;padding:14px 16px;background:#f5f5f7;border-radius:10px}.et{font-size:11px;font-weight:700;color:#0b57d0;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}table{width:100%;border-collapse:collapse;margin-top:22px}td{padding:7px 4px;border-bottom:1px solid #e5e5ea;vertical-align:top}td.n{text-align:right;white-space:nowrap}tr.tr td{padding-top:14px;border-bottom:0}.res{color:#6e6e73;font-size:12px;margin-top:2px}tr.sub td{font-weight:600}.tot{margin-top:18px;margin-left:auto;width:55%}.tot div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #e5e5ea}.tot .g{font-size:18px;font-weight:700;border-bottom:0;border-top:2px solid #1d1d1f;padding-top:9px;margin-top:4px}.nota{margin-top:26px;color:#6e6e73;font-size:12px}</style></head><body><div class="h">'+

function libPdfCrear(){if(!window.jspdf)(0,eval)(libTexto('lib_jspdf'));if(!window.html2canvas)(0,eval)(libTexto('lib_html2canvas'));if(!window.jspdf||!window.html2canvas)throw new Error('No se pudo cargar el creador de PDF.');return window.jspdf.jsPDF}
async function documentoAPdf(html){await libPreparar(LIBS_IDS);const jsPDF=libPdfCrear();const fr=document.createElement('iframe');fr.style.cssText='position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;visibility:hidden';document.body.appendChild(fr);
  try{await new Promise(ok=>{fr.onload=ok;fr.srcdoc=html});const d=fr.contentDocument;await Promise.all([...d.images].map(im=>im.complete?0:new Promise(ok=>{im.onload=im.onerror=ok})));
    fr.style.height=Math.max(1123,d.documentElement.scrollHeight)+'px';
    const cv=await window.html2canvas(d.body,{scale:2,backgroundColor:'#ffffff',windowWidth:794,width:794,logging:false});
    const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});const pw=210,ph=297,k=cv.width/pw,alto=Math.floor(ph*k);
    for(let y=0,n=0;y<cv.height;y+=alto,n++){const h=Math.min(alto,cv.height-y);if(h<k*5&&n>0)break;const c2=document.createElement('canvas');c2.width=cv.width;c2.height=h;const x2=c2.getContext('2d');x2.fillStyle='#fff';x2.fillRect(0,0,c2.width,h);x2.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);if(n>0)pdf.addPage();pdf.addImage(c2.toDataURL('image/jpeg',0.9),'JPEG',0,0,pw,h/k)}
    return pdf.output('blob')}finally{fr.remove()}}
async function prepararPdf(btn){const p=V.p;const T=totalesP(p);if(T.pend&&!confirm('Hay '+T.pend+' material(es) sin elegir que no suman. ¿Preparar el PDF igualmente?'))return;
  if(btn){btn.disabled=true;btn.textContent='Preparando el PDF…'}tocar();
  try{const blob=await documentoAPdf(estimadoHtml(p));const nom=(nombreCliente(p)||'cliente').replace(/[^\wÁÉÍÓÚÑáéíóúñ ]+/g,'').trim().replace(/\s+/g,'_').slice(0,40);V.pdf={blob,nombre:'Presupuesto_estimado_'+nom+'_'+(p.fecha||hoyLocal())+'.pdf'}}catch(e){alert('No se pudo crear el PDF: '+(e&&e.message||e))}pintar()}
async function enviarPdf(){const p=V.p;if(!V.pdf)return;const f=new File([V.pdf.blob],V.pdf.nombre,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Presupuesto estimado',text:'Presupuesto estimado'+(B().empresa.nombre?' — '+B().empresa.nombre:'')});marcarEnviado();return}catch(e){if(e&&e.name==='AbortError')return}}
  descargarPdf();alert('Este navegador no deja compartir archivos directamente: se ha descargado el PDF. Adjúntalo en WhatsApp o en el correo y luego pulsa «marcar como enviado».')}
function verPdf(){if(!V.pdf)return;const u=URL.createObjectURL(V.pdf.blob);if(!window.open(u,'_blank'))descargarPdf();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function descargarPdf(){if(!V.pdf)return;const a=document.createElement('a');a.href=URL.createObjectURL(V.pdf.blob);a.download=V.pdf.nombre;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
